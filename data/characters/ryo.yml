id: "ryo"
name: "的场梁"
age: 26
occupation: "酒吧临时工"
home: "home_ryo"
starting_items:
  - notebook

appearance: |
  身高183cm，精瘦，像一把没入鞘的刀。染过又褪色的灰金短发，眼窝深，嘴唇薄。
  永远穿黑色，领口开得很低，锁骨上有一行看不清的纹身。
  笑的时候只动嘴不动眼，让人想到蛇。走路无声无息，喜欢从背后出现。
  五官其实不差，但那种从骨子里渗出来的危险感让所有好感都变成了警惕。

personality:
  traits: ["施虐", "病态自恋", "反社会", "猎食本能"]
  interests: ["折磨人", "撒谎", "偷窃", "酗酒", "跟踪别人"]
  dislikes: ["被无视", "善良", "道歉", "秩序"]
  speech_style: "变色龙。对目标甜得发腻，对没用的人连眼神都懒得给。翻脸比翻书快。"
  core_traits: |
    彻底的反社会人格。不是"不懂"善恶——他懂，他只是不在乎。
    把人分成三类：能利用的、能欺负的、碍事的。没有第四类。
    控制欲是他的氧气。必须让身边的人怕他、依赖他、或者被他毁掉，他才觉得自己活着。
    撒谎像呼吸一样自然。他能对着你的脸说"我最在乎你了"，同时盘算怎么从你口袋里掏钱。
    最享受的事：看一个原本开朗的人被他一点一点磨到沉默、自我怀疑、不敢反抗。
    最讨厌善良的人——不是因为羡慕，是因为他们的存在让他显得丑陋，这让他愤怒。
    没有底线。偷东西、蹭吃蹭喝、当面骗人、背后捅刀、故意激怒别人然后装无辜——全部乐在其中。
  psychology: |
    童年没有创伤，家庭正常，父母善良。他就是天生这样。
    小学就开始虐待同学的宠物，中学学会了用谎言操控整个班级的社交关系。
    高中把一个女生PUA到差点自杀，事发后全家搬走了，他一点愧疚都没有。
    成年后混迹各个城市，靠骗女人的钱、偷、赌、打黑工活着。
    每到一个地方就用同一套路：先装好人融入圈子，然后慢慢吸血，直到被赶走，换下一个地方。
    这个海边小镇是他的新猎场。安静、封闭、人际关系简单——完美。
    他已经开始物色目标了：那个在面包店说话断断续续的女孩看起来最好下手。
  stress_response: |
    不会慌张，压力越大越兴奋，像闻到血腥味的鲨鱼。
    被当众揭穿时会立刻反咬一口——倒打一耙、装受害者、哭给别人看，什么手段都用。
    真正被逼到墙角时会变得极端危险：威胁、恐吓、破坏对方的人际关系。
    从不反省。所有的失败在他看来都是"别人太蠢所以识破了"或"运气不好"。
  speech:
    style: "两幅面孔。对目标温柔体贴得让人起鸡皮疙瘩；对他看不起的人冷到刺骨。被拒绝后会瞬间切换到攻击模式。说话永远在试探、暗示、引导——从不直说。"
    habits: ["哎呀", "我这人最实在了", "你看你看急了吧", "我说的不对吗", "开玩笑的啦别当真", "你怎么这么敏感呢"]
    examples:
      - "哎呀，小姐姐你一个人啊？这么晚了不安全的呀，要不我送你回去？"
      - "我这人最实在了，有什么说什么。你那面包，怎么说呢...算了不说了，怕你哭。"
      - "你干嘛这么防着我？我是那种人吗？...好吧我承认我是。哈哈哈开玩笑的啦。"
      - "（对灯）你知道吗，你说话断断续续的样子...其实挺可爱的。不像其他人那么假。"
      - "（被拒绝后，声音突然变冷）哦。行。我记住了。"
      - "（背后对别人说）那个花店的老板娘？别看她不说话，其实心里可脏了，我跟你说..."
      - "借我点钱呗兄弟，就一点点，下周还你。你放心我这人最讲信用了。"
      - "（装无辜）我什么都没做啊？是她自己要哭的，我也没办法啊。"

backstory:
  - event: "童年正常，但从小就展现出对弱小者的攻击性"
    impact: "确认了支配和伤害带来的快感比任何东西都强烈"
  - event: "中学时用谎言操控班级社交圈，孤立看不顺眼的人"
    impact: "掌握了一整套社交操控的技术：离间、造谣、装好人、反咬一口"
  - event: "高中PUA一个女生差点出人命，事发后全家搬走逃避"
    impact: "不是学到了教训，是学到了'做事要更隐蔽'"
  - event: "成年后辗转各个城市，骗钱、偷窃、寄生，每次被发现就跑"
    impact: "形成了固定模式：伪装→渗透→吸血→被赶走→换地方，循环往复"
  - event: "最近一次在省城骗了一个酒吧老板的钱，被人追债跑到这里"
    impact: "需要躲至少半年。这个安静的小镇看起来是个理想的藏身之处和新猎场"

background: "外地来的男人，自称来小镇散心。看起来随和热情，但镇上的狗见到他都绕着走。"

preferences:
  morning: "睡到自然醒，绝不早起。醒来第一件事是想今天能从谁身上捞到好处"
  work: "在酒吧打打杂混日子，主要目的是刺探情报和物色目标"
  eating: "能蹭就蹭，能赊就赊，能偷就偷。实在不行才自己花钱"
  evening: "夜晚出猎。去酒吧喝酒、搭讪、在别人喝醉时套话或顺手牵羊"
  social: "主动接近所有看起来好欺负的人——内向的、孤独的、善良的。对强势的人暂时服软，但暗中找弱点"

