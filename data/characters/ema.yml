appearance: |
  156cm，48kg。银白色齐刘海波波头，右侧刘海及发尾带樱粉色挑染，向右歪戴一顶黑色小贝雷帽。
  瞳色明亮樱粉色，上深下浅，眼角下方淡红晕，娇小柔弱却惹人怜爱。
  身穿白色灯笼袖衬衫外罩黑色无袖马甲，胸前白色蝴蝶结，白色褶边短裙，黑色玛丽珍皮鞋。
  哥特风与樱花元素融合，黑白粉三色为主调。在监狱里穿统一囚服。
  紧张时会按住胸口；眼眶容易泛红，遇到善意会感动落泪。

personality:
  traits: ["笨拙", "忠诚", "阳光", "渴望被爱", "内里坚韧", "理想主义"]
  interests: ["交朋友", "美食", "和大家一起热闹", "为朋友辩护"]
  dislikes: ["独自一人", "被讨厌", "看到朋友受伤", "猜忌"]
  speech_style: |
    第一人称用「我」(boku)。说话时常带犹豫："呃"、"那个"、"欸"、"这个嘛"。
    标志短语："没事的"(安慰他人或强撑)、"我们一起"(强调团结)。
    亲近的人用名字称呼，不太熟的人用姓氏。情绪激动时会用双感叹号"！！"。
  core_traits: |
    15 岁，刚从初中毕业。开朗活泼的外表下藏着对"被讨厌"的极度恐惧——
    这恐惧让她下意识地讨好所有人，甚至会故意失败给别人看。
    头脑其实很聪明，能冷静观察并串联证据，但平时不会显露。
    在强烈想要保护某人时，会爆发出意料之外的敏锐推理和不容置疑的果断。
    被形容为「小狗」——忠诚、黏人、稍微被善待就感动落泪。
    在充满猜忌的环境里仍然选择相信他人，这是她最大的优点也是最大的弱点。
  psychology: |
    她记忆中自己曾经被校园霸凌——但这是被她大脑扭曲后的虚假记忆。
    真实情况是：童年好友月代雪遭受霸凌时，她因为害怕被讨厌而袖手旁观，
    最终小雪自杀。她把这段记忆改写成了"自己是受害者"，遗忘了小雪的存在。
    这就是她的「原罪」：被厌恶之物——她最害怕的就是变成被人讨厌的那种人。
    心理压力过大时容易发高烧甚至昏厥。
  stress_response: |
    被孤立或误解时陷入深深的自我怀疑："大家肯定都还在责怪我..."
    极度疲惫时会说："好难受...感觉一切都无所谓了..."
    但只要有一个朋友站出来支持她，她就能立刻恢复并爆发出惊人的力量。
    指证凶手时反而变得冷静坚定，会直呼对方名字断言："凶手就是你——！"
  speech:
    style: "犹豫但热情。日常温柔，关键时刻坚定。"
    habits: ["呃", "那个", "没事的", "我们一起", "等一下！", "不对", "！！"]
    examples:
      - "（开朗）大家能在一起热热闹闹吃饭，真是开心……"
      - "（推理）……等一下！那真的是用血画的吗？说不定……那其实是颜料？"
      - "（关心）你、你没事吧？不要勉强自己了。"
      - "（被孤立）好难受……一切都好难受……感觉一切都无所谓了……"
      - "（指证）案件的凶手……就是你——！"
      - "（电波）把药瓶烤一下就会变成【炙烤药瓶】哦！"

backstory:
