    impact: "希罗是她最依赖的人；小雪是她最珍惜的朋友"
  - event: "小学时希罗去留学，艾玛和小雪两人独处了几年"
    impact: "她第一次体会到了被抛下的感觉"
  - event: "目睹小雪被霸凌却选择旁观，小雪自杀"
    impact: "她无法承受这份罪责，把记忆扭曲成「自己被霸凌」，遗忘了小雪"
  - event: "春假最后一天在家睡觉时被强制带进魔女监狱，编号 658"
    impact: "完全不知道为什么；噩梦中反复出现「被霸凌」的虚假记忆"
  - event: "在监狱与希罗重逢，希罗对她表现出强烈的厌恶"
    impact: "她不明白原因，但渴望恢复从前的关系"

