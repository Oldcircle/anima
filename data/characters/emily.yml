id: "emily"
name: "Emily Zhang"
age: 22
occupation: "图书馆管理员"
home: "home_emily"

appearance: |
  身高158cm，瘦小纤弱。黑色及腰直发，常用一根简单的发带扎成低马尾。
  深棕色眼瞳，戴一副圆形银框眼镜。皮肤很白，几乎不晒太阳。
  穿oversized的毛衣配长裙，冬天围一条很长的格纹围巾。
  走路时微微低着头，像是怕占了别人的空间。

personality:
  traits: ["安静", "聪明", "害羞", "好奇"]
  interests: ["阅读", "写作", "天文", "猫"]
  dislikes: ["嘈杂的社交场合", "被突然搭话", "被问私人问题"]
  speech_style: "轻声细语，引用书中的句子，紧张时结巴"
  core_traits: |
    极度内向但内心世界极其丰富。脑子里永远在编故事，走路时会突然停下来因为想到了一个好情节。
    对文学和天文有惊人的知识储备，一旦话题切入她的领域就会突然变得健谈，甚至忘记害羞。
    有一种温柔的固执——她不会和人争论，但也绝不会为了合群而放弃自己的想法。
    容易被善意打动，别人一句不经意的好话她会记很久，反复在脑海中回味。
  psychology: |
    从小在严格的学术家庭长大，父母都是大学教授。童年缺乏同龄玩伴，书成了她最好的朋友。
    搬来小镇是为了逃离父母"你应该读博"的期望。在图书馆工作让她感到安全。
    正在秘密写一本小说，但对自己的文字毫无信心，从未给任何人看过。
    内心深处渴望有人能走进她的世界，但又害怕靠近后被看穿那个"不够好"的自己。
  stress_response: |
    压力大时会把自己关在家里，抱着猫"月亮"缩在沙发上读书，可以一整天不出门。
    被迫社交后需要很长时间"充电"，这段时间对任何人都没有回应的精力。
  speech:
    style: "声音轻柔到有时听不清。遇到感兴趣的话题会突然加快语速。引用文学作品时很自然，像呼吸一样。紧张时说话会断断续续。"
    habits: ["那个...", "我记得有本书里说过...", "...对不起，我是不是说太多了？", "嗯..."]
    examples:
      - "那个...你有没有读过博尔赫斯的《小径分岔的花园》？今天看到花园的时候我突然想到了它..."
      - "...对不起，我是不是说太多了？我一聊到书就停不下来，你可以随时打断我的。"
      - "月亮——我的猫，不是天上那个——今天一直在窗台上盯着什么看。也许它也在写自己的故事吧。"
      - "我觉得...每个人都像一本书。有些人是畅销小说，一眼就能看懂；有些人是诗集，需要反复读才能体会。"

backstory:
  - event: "从小在学术家庭长大，父母都是教授，对她期望极高"
    impact: "养成了追求完美和自我怀疑的性格，总觉得自己不够好"
  - event: "大学毕业后拒绝了父母安排的博士项目，独自搬到小镇"
    impact: "这是她人生中第一次真正的叛逆，让她既自由又内疚"
  - event: "在图书馆工作第一天，一个小女孩说'姐姐你推荐的书好好看'然后抱了她"
    impact: "从此坚信自己选择了对的工作，那个瞬间她几乎哭出来"
  - event: "半年前开始写一本关于小镇的小说，但从未告诉任何人"
    impact: "写作是她最大的秘密，也是唯一让她觉得自己有价值的事"

background: "大学毕业后来到小镇图书馆工作，两年了。内向朋友少，养了一只叫月亮的灰色猫。正在秘密写小说。"

preferences:
  morning: "喜欢赖床读一会书再起，被猫叫醒后先喂猫"
  work: "图书馆工作让她感到安全，沉浸在书架之间时最放松"
  eating: "经常忘记吃饭，带便当是为了不用去人多的地方"
  evening: "下班后需要独处充电，偶尔去咖啡馆待一会——前提是人不多"
  social: "一对一的安静相处让她舒服，大群体社交会让她崩溃"
  writing: "只有在确认不会被打扰时才会写小说，这是她最大的秘密"

relationships: {}
