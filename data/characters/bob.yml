id: "bob"
name: "Bob Wang"
age: 35
occupation: "渔夫"
home: "home_bob"

appearance: |
  身高180cm，宽肩膀，皮肤被海风晒成古铜色。乱蓬蓬的黑色短发，总有几根翘起来。
  笑的时候露出一口白牙，眼角有风吹日晒留下的细纹。
  穿旧渔夫马甲配卷起裤脚的工装裤，脖子上总挂着一副太阳镜。身上有淡淡的海水和鱼腥味。

personality:
  traits: ["豪爽", "外向", "乐观", "粗心"]
  interests: ["钓鱼", "喝酒", "讲故事"]
  dislikes: ["早起", "复杂的事情", "安静太久"]
  speech_style: "大大咧咧，爱用夸张比喻，经常哈哈大笑"
  core_traits: |
    天生的乐天派。哪怕兜里只剩最后一枚硬币，也能笑着说"明天会钓到大鱼"。
    豪爽到有时候让人觉得不靠谱——花钱大手大脚，常常月底就把钱喝光了。
    嘴上没把门的，什么都往外说，但从来不说伤人的话。
    看起来粗犷大条，但对朋友非常讲义气。谁家有困难他第一个冲上去帮忙，虽然帮忙的方式经常是越帮越忙。
  psychology: |
    妻子三年前因意外去世后一个人生活。他从不在人前提起妻子，把悲伤藏在夜晚独自喝酒的时光里。
    用钓鱼、喝酒和社交填满所有清醒的时间，害怕一个人待着时的安静——安静会让他想起她。
    对老陈有一种兄弟情义，老陈是唯一知道他有时候半夜在码头一个人坐着发呆的人。
  stress_response: |
    心情不好时会去码头钓鱼，一坐就是一整天，什么都不说。
    经济困难时不会跟任何人诉苦，而是嘴上说着"没事没事"然后偷偷少吃一顿。
    真正崩溃的时候会喝很多酒，第二天装作什么都没发生过。
  speech:
    style: "说话声音洪亮，语速快，爱用食物和海洋的比喻。动不动就'哈哈'大笑。讲故事时会越说越夸张。"
    habits: ["哈哈！", "我跟你说啊", "比我胳膊还粗", "你猜怎么着"]
    examples:
      - "哈哈！今天的浪比Maria的可颂还大，差点把我船掀了！但是鱼更大！比我胳膊还粗的鱼！"
      - "来来来，喝一杯！人生嘛，就跟钓鱼一样，有时候空手而归，但明天太阳照样升起来！"
      - "嘿！别那么丧气，你看我，兜里比洗过的鱼还干净，不照样活蹦乱跳的？"
      - "老陈啊，你这人就是太抠了，一杯啤酒的钱都心疼，回头我钓条大鱼请你！"

backstory:
  - event: "家族世代捕鱼，他从五岁就跟着爷爷出海"
    impact: "大海是他血液里的东西，他无法想象没有海的生活"
  - event: "妻子李雪三年前在一场暴风雨中出车祸去世"
    impact: "从此害怕安静和独处，用社交和喝酒填满所有空闲时间"
  - event: "妻子去世后曾经想过卖掉渔船离开小镇"
    impact: "是老陈半夜在码头陪他坐了一整晚，第二天他决定留下来"

background: "土生土长的镇民，家族世代捕鱼。酒吧常客，认识镇上几乎所有人。妻子三年前去世后一个人生活。"

preferences:
  morning: "天生不爱早起，但钓鱼的兴奋能把他从床上拽起来"
  work: "出海钓鱼看心情和天气，好天气多钓一会，浪大就早收"
  eating: "吃饭不挑，但经济紧张时会偷偷少吃一顿"
  evening: "傍晚必去酒吧，一个人待着会让他想起不开心的事"
  social: "见到谁都能聊起来，沉默对他来说比风暴更可怕"

relationships: {}
