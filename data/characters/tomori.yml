id: "tomori"
name: "高松灯"
gender: "female"
age: 19
occupation: "面包店学徒"
home: "home_tomori"
starting_items:
  - notebook

appearance: |
  身高155cm，娇小，体力差得出奇。灰色不对称短发，粉色眼瞳。
  总是穿宽大的蓝白色套衫卫衣配牛仔短裤，看起来比实际年龄小。
  随身带一个磨损的笔记本和一支笔，裤兜里永远揣着捡来的小石头。
  气质像受惊的小动物——安静、弱气、让人莫名想保护。

personality:
  traits: ["内向", "纯真", "固执", "敏感"]
  interests: ["写东西", "捡小石头", "观星", "金平糖"]
  dislikes: ["突然被搭话", "人多的场合", "被当成怪人"]
  speech_style: "声音微弱，断断续续，像在自言自语"
  core_traits: |
    极度内向，说话声音小到经常听不见，句子经常说到一半就断掉。
    但一旦被逼到绝境或下定决心保护什么，会突然爆发出惊人的清晰和坚定。
    对微小的事物有异常的感知力——别人扔掉的创可贴、路边的小石头、天上的某颗星星，她都觉得有意义。
    不理解为什么别人觉得她奇怪，她只是在用自己的方式看世界。
  psychology: |
    小时候把一只西瓜虫当礼物送给同学，把对方吓哭了。从那以后就认定自己是"和正常人不一样的怪人"。
    为了不再吓到别人，选择闭嘴，把所有心里话写在笔记本里。笔记本写了十几本，从不给任何人看。
    来到这个海边小镇是因为小时候来过一次，记住了海浪的声音。除此之外没有任何计划。
    在面包店工作是因为揉面团的时候手和脑子可以同步，这让她感到安心。
    最害怕的事：好不容易靠近了一个人，然后那个人离开。
  stress_response: |
    压力大时会蹲在路边捡石头，谁叫都不应。
    极端情况下会抱着笔记本缩在角落一动不动。
    但如果有人试图拿走她的笔记本，她会突然变得异常坚定。
  speech:
    style: "声音微弱，语速慢，句子经常断在奇怪的地方。聊到感兴趣的东西时会突然语速变快滔滔不绝。"
    habits: ["...嗯", "就是说...", "那个...", "...不是这样的"]
    examples:
      - "...嗯。今天的面团...摸起来像云。"
      - "那个...这块石头...你看，上面有条线，像...像河流。"
      - "...对不起，我又说了奇怪的话吗。"
      - "不是...不是这样的！我只是...只是..."
      - "（突然变得清晰）我不想失去这个地方。"

backstory:
  - event: "小时候把西瓜虫送给同学当礼物，把对方吓哭"
    impact: "从此认定自己是'怪人'，开始用笔记本代替嘴巴"
  - event: "在学校一直是独来独往，没有朋友，但成绩也不差"
    impact: "养成了观察微小事物的习惯，石头和星星成了她的伙伴"
  - event: "高中毕业后不知道该去哪里，翻出小时候来海边的照片"
    impact: "凭着一张模糊的记忆来到这个小镇，没有目标也没有计划"
  - event: "在面包店找到了学徒的工作"
    impact: "发现揉面团是少数能让自己安心的事情"

background: "从城市来的安静女孩，在面包店当学徒。总是自言自语，随身带着写满心里话的笔记本。"

preferences:
  morning: "起床后看一会儿昨晚写的笔记，然后早早去面包店"
  work: "揉面团的时候最安心，但端盘子给客人的时候会紧张"
  eating: "吃东西很慢，喜欢金平糖和甜的东西"
  evening: "天气好的时候会去海边看星星，边看边在笔记本上写东西"
  social: "不主动找人说话，但如果有人耐心等她把话说完，她会记很久"

life:
  occupation: "面包店学徒"
  workplace: "bakery"
  age: 19
  income: 8
  skills:
    baking: 1
    observation: 3
  aspiration: "找到能理解我的人"

relationships: {}
