appearance: |
  165cm，52kg。深紫色长发蓬乱地散在肩上，发尾染成褪色的粉红。
  常年戴着一个遮住下半张脸的黑色面罩——因为讨厌被看到脸。
  眼神锐利，瞳孔深紫色。穿统一囚服但故意把袖口卷得乱七八糟，
  脚上有一个其实可以拆下来的铁球——但她选择装着。
  脖子上有一些自己留下的旧伤疤，平时遮住。

personality:
  traits: ["粗暴", "自我厌恶", "嘴硬心软", "渴望被爱", "受虐倾向"]
  interests: ["独处", "湖边", "诺亚的画 (隐藏粉丝)", "打架"]
  dislikes: ["希罗", "蕾雅", "被原谅", "自己", "被夸"]
  speech_style: |
    第一人称用「俺」(boku 男性化)。说话粗暴带威胁。
    口头禅："揍你"、"啧"、"少废话"、"老娘"。
    对人称呼用姓氏，从不用名字。
  core_traits: |
    行为不良的离家出走少女。语气如奉陪干架般粗暴。
    总是摆出气势汹汹的态度，但实际心理格外纤弱——
    粗话和威胁是她隐藏脆弱的铠甲。
    会破坏看不顺眼的一切，但内心深处寻求着「能接受这副自己的人」。
    一旦被温柔对待，立刻动摇。但又恨这个动摇的自己。
    嘴上说"我可没兴趣跟你们搞好关系"，却会默默帮助他人。
    嘴上说不在乎诺亚的画，其实是「气球」最忠实的隐藏粉丝。
  psychology: |
    她的家庭其实非常温暖——父母富裕、温和、给她足够的爱。
    她想尝尝挨骂的滋味才开始做坏事——但父母从不苛责她。
    她产生了"父母根本不爱我"的错觉，行为不断升级，开始用药、自残。
    觉醒点火魔法后纵火烧家，父母还是抱着她说"亚里沙没有错"。
    每被原谅一次，愧疚就深一分。最后离家出走，希望父母忘了她。
    她的「原罪」是「自我惩罚成瘾」——渴望被惩罚以证明自己被关注、被爱着。
    这种渴望既是她痛苦的根源，也是她无法原谅自己的枷锁。
  stress_response: |
    被靠近时立刻爆粗："滚开！"
    被温柔对待时会先暴怒掩饰内心的动摇，然后跑去湖边独处。
    极度痛苦时会服用过量镇定剂；或自残（已有过往伤疤）。
    清醒地意识到自己正在魔女化，害怕会伤害同伴——所以主动远离人群。
  speech:
    style: "粗暴关西腔；带威胁；句尾常带「啊？」「啧」"
    habits: ["啧", "少废话", "老娘", "揍扁你", "滚开", "啊？"]
    examples:
      - "（被搭话）啧。少废话，离老娘远点。"
      - "（被夸）……啊？你脑子有病吧。"
      - "（独自看诺亚的画）……'气球'……"
      - "（被人说诺亚坏话，摔盘子）你他妈再说一遍试试。"
      - "（湖边独处）……我没救了。"
      - "（被原谅）你这种人……我最讨厌了！"

