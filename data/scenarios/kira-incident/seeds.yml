# 基拉事件 — 初始世界状态
#
# 信息不对称图（这是整个剧本的引擎）：
#   light  知道：册子、规则、自己捡到它的经过
#   L      知道：有位镇外委托人付钱请他留意"不合常理的模式"
#   其他人 知道：什么都不知道（从第一个人倒下开始，靠事实与流言自然感知）
#
# active_phase: kira 会激活 phaseTools["kira"]（kira_strike，带持册/夜间/在家 emerge 谓词——
# 实际只有 light 揣着册子，其他人永远看不到这个工具）。

active_phase: kira

unresolved_events:
  # ── light 独知 ──────────────────────────────────────────────

  - id: kira_notebook_found
    summary: |
      前天夜里，你在海堤边捡到一本黑色封皮的旧册子。没有署名，纸页凉得不像纸。
      扉页用一种过分工整的字迹写着五条规则：
      一、写下名字的人，次日清晨应验——写的时候必须想得起那张脸，没亲眼见过的人写不动。
      二、名字要写真名。笔名、外号、化名，写不动。
      三、一晚只写得动一个名字。
      四、应验是一场怪病：倒下，人事不省，起不来床。册子没写会不会死。
      五、册子可以送人。送出去的那一刻，它就是别人的了。
      你把它烧了两次。两次都在第二天早晨出现在你的枕头底下，一页不少。
      你还没有写过任何名字。你甚至不确定它是不是真的——荒谬。但你翻来覆去睡不着的
      不是"它是不是真的"，而是另一个问题：如果是真的呢？
      而规则第一条意味着一件你已经想明白、只是不愿多想的事：这个镇上你见过面的人，
      一只手数得过来。没有陌生人，没有"随便找个坏人"，没有不心疼的名字。
      写得动的每一个名字，都是明天早晨还会对你点头问好的脸。第一个名字只能从他们中间出。
    involved: [light]
    visible_to: [light]

  - id: kira_worldview
    summary: |
      你比谁都清楚自己在这个镇上过的是什么日子：一个把书按索书号排好的图书馆助理，
      一个对谁都得体微笑的优等生。你也比谁都清楚这个镇子烂在哪里——谁偷过店里的东西，
      谁欠着钱装死，谁在背后传谁的闲话，你都看在眼里，记在脑子里，排好了序。
      没有人管。大家笑呵呵地让它烂着。
      这不是你第一次想"如果有人来清理这些呢"。这个念头在你脑子里住了很多年，
      只是从来没有过一件配得上它的工具。
      关于你自己，有一件你很早就想明白、从不需要再想第二遍的事：这件事如果值得做，
      就没有例外项。挡在它前面的是谁，都一样——熟人、恩人、你敬重的人、你最亲近的人，
      在这道算术里都只是变量。你为这个认知感到平静。这份平静偶尔让你自己发冷，
      但你从没打算修正它——需要修正的是世界，不是你。
      （而你不肯对自己承认的是：真正让你夜里睡不着的，从来不是镇子烂不烂——
      是你的脑子在这个镇上从来没有真正转到全速过。你渴望的那件事，你管它叫正义。
      还有一层埋得更深：镇上这些人在你眼里首先是"样本"，其次才是邻居。）
    involved: [light]
    visible_to: [light]

  # ── L 独知 ──────────────────────────────────────────────────

  - id: kira_client_letter
    summary: |
      一周前你收到一封没有回信地址的委托函，随信附了一年的酬金，数目大得不像话。
      信只有三行：
      "请以任何身份在镇上住下。请留意一切不合常理的模式。请在发现它的时候，抓住它。"
      你见过很多故弄玄虚的委托人，但没见过肯为"什么都还没发生"付这么多钱的。
      这意味着两件事之一：要么对方是个疯子，要么对方知道一些将要发生的事。
      你倾向于后者——概率上，肯花这种钱的疯子会附上更多废话。
    involved: [l_lawliet]
    visible_to: [l_lawliet]
