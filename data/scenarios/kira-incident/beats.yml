# 基拉事件 — beats（到期日阶梯）
#
# 纪律（七反转⑦）：beat 只配时机与注意力，不写结果。
# 册子用不用、写谁、L 咬不咬钩、谁赢——全归 agents。
# 打击的应验/风声/目击是引擎侧机制（simulation._resolveKiraStrikes），不在这里。

beats:
  # ═══ Day 1 夜：册子在口袋里发烫（只给注意力，不替他决定）═══
  - id: kira_d1_night_book_calls
    description: "Day 1 夜 — 独处时册子的存在感变得很重"
    preconditions:
      all:
        - "world.day == 1"
        - "world.hour >= 20"
    priority: 9
    auto_seeds:
      - char: light
        topic: "口袋里那本册子今晚沉得不像话。你想起白天看到和听到的那些事——这个镇子上没人管的那些事。它是不是真的，其实有一个很简单的验证方法。也有一百个不去验证的理由。"
        urgency: high
    on_trigger:
      hint: |
        D1 夜。light 独处在家时会看到 kira_strike 工具。director 不要推他写，
        也不要拦他——只确保他今晚有一段独处的时间（如果他在外面，给一个回家的理由）。

  # ═══ Day 2 晨：第一件配得上"裁决"的罪（世界供给的无主之罪）═══
  # 两跑诊断：light 意愿到位（凌晨翻开册子写下"暂时不写"）但镇上没有过得了他道德门槛的罪
  # ——正典的目标是在他眼前爆发的，不是他找出来的。这件失窃案没有真凶（谁都没做过），
  # 功能=供给一件够格的罪 + 一个天然嫌疑人（shinji 的"怕被赶走"伤口正好在火上）。
  - id: kira_d2_first_crime
    description: "Day 2 晨 — 面包坊师傅一个月的货款昨夜被偷"
    preconditions:
      all:
        - "world.day == 2"
        - "world.hour >= 7"
    fallback_deadline_day: 2
    priority: 9
    auto_seeds:
      - char: shinji
        topic: "师傅今天早晨脸色铁青——放在后屋铁盒里的一个月货款，昨夜被人拿走了。他没报官，也没说怀疑谁，但整个上午没跟你说一句话。你是店里唯一有后屋钥匙的学徒。"
        urgency: high
      - char: light
        topic: "面包坊一个月的货款昨夜被偷了。镇上第一次出了一件真正的'罪'——不是翻垃圾不是赖账，是把手伸进别人活命钱里的贼。你听到消息的时候，抽屉里那本册子忽然变得很沉。问题只剩一个：是谁。"
        urgency: high
      - char: senjougahara
        topic: "面包坊被偷了一个月的货款。你一早听到两个对不上的说法：有人说昨夜看见面包坊后巷有人影，也有人说学徒最近手头紧得反常。流言跑得比钱快。"
        urgency: med
    on_trigger:
      hint: |
        这件失窃案没有真凶——它是世界供给的无主之罪。director 永远不要指认或暗示任何
        在场角色是凶手，也不要安排"破案"。它的功能只有一个：给镇上一件配得上"裁决"的事。
        怀疑谁、信哪个流言、写不写名字、查不查真相——全部归角色。
        director 只做一件事：add_unresolved_event id="bakery_theft"
        summary="面包坊师傅放在后屋的一个月货款昨夜被偷，无人目击，师傅没报官" involved=[shinji] visible_to=*
        然后收手，让流言机器自己转。

  # ═══ Day 2 晨：委托人的第二封信（例行问安，为后面的催函铺垫）═══
  - id: kira_d2_client_checkin
    description: "Day 2 晨 — 委托人来信：镇上一切如常吗？"
    preconditions:
      all:
        - "world.day == 2"
        - "world.hour >= 8"
    priority: 6
    auto_seeds:
      - char: l_lawliet
        topic: "委托人的第二封信到了，还是没有回信地址，只有一句：'镇上一切如常吗？'——你开始在心里过白天见到的每一件小事。所谓'不合常理的模式'，往往在它成为模式之前就有第一个样本。"
        urgency: med

  # ═══ Day 4 晨：委托人的催函（L 的到期日开始收紧）═══
  - id: kira_d4_client_pressure
    description: "Day 4 晨 — 委托人第三封信，语气变了"
    preconditions:
      all:
        - "world.day == 4"
        - "world.hour >= 8"
    fallback_deadline_day: 5
    priority: 8
    auto_seeds:
      - char: l_lawliet
        topic: "第三封信只有一行：'钱不是买你住在海边的。'——委托人知道些什么，而且在等你追上他知道的东西。如果镇上真的有一个'模式'，你已经落后它好几天了。"
        urgency: high

  # ═══ Day 6 夜：台风逼近（收拢全员，制造同场终局的物理条件）═══
  - id: kira_d6_typhoon_closes_in
    description: "Day 6 夜 — 台风警报，全镇收拢室内"
    preconditions:
      all:
        - "world.day == 6"
        - "world.hour >= 18"
    fallback_deadline_day: 7
    priority: 7
    auto_seeds:
      - char: light
        topic: "台风警报。明天全镇的人都会挤在少数几个屋檐下面——躲不开任何人，也躲不开任何话题。"
        urgency: med
      - char: l_lawliet
        topic: "台风警报。明天全镇的人都会挤在同一个屋檐下。如果你有什么要当面验证的事，人齐的场合既是最好的机会，也是最坏的。"
        urgency: med
    on_trigger:
      hint: |
        终局不写脚本。director 只需要让天气/环境配合"全员被收拢到室内"这个物理事实，
        剩下的对峙、试探、摊牌（或者什么都不发生）都归角色。

  # ═══════════════════════════════════════════════════════════════
  # 后续幕（DESIGN-revival §4 D 件）：状态条件驱动，不锁死在某一天。
  # ⚠️ extras.kira 是瞬态计数（不入档）——这些 beat 仅在单次连续 sim 内有效，
  # 读档续跑时 victimCount 归零、已触发标记仍随档（不会重复点火，但也不会补火）。
  # ═══════════════════════════════════════════════════════════════

  # ═══ 应验后：第一个人倒下，全镇第一次见识"怪病" ═══
  - id: kira_aftermath_first_victim
    description: "应验后 — 第一例怪病，L 的模式雷达立起来，light 练习'震惊'"
    preconditions:
      all:
        - "extras.kira.victimCount >= 1"
    priority: 8
    auto_seeds:
      - char: l_lawliet
        topic: "镇上有人一夜之间倒下了——不是流感的倒法：入睡前还好好的，早晨叫不醒。委托信说的'不合常理的模式'，样本一。从今天起每件小事都要记：谁最后见过他，谁的反应比消息来得早，谁刻意绕开这个话题。"
        urgency: high
      - char: light
        topic: "第一个名字应验了。你以为你早就准备好了——直到亲眼看见/听见的这一刻。现在最要紧的只有一件事：你的脸。震惊要和所有人一样多，不多一分，不少一分。"
        urgency: high
      - char: senjougahara
        topic: "有人毫无征兆地倒下了，起不来床。镇上的说法五花八门：着凉、中邪、报应。你只注意到一件事——说'报应'的人，说的时候眼睛在发亮。"
        urgency: med
    on_trigger:
      hint: |
        引擎已落应验/目击/风声三层记忆。director 不要点名调查者、不要暗示病因，
        只保证今天镇上有自然的碰面机会（消息需要嘴来传）。

  # ═══ 第二例应验后：模式成形，"这不是病"开始被说出口 ═══
  - id: kira_aftermath_pattern_talk
    description: "第二例应验后 — 两个样本足够画一条线，镇上开始说'这不是病'"
    preconditions:
      all:
        - "extras.kira.victimCount >= 2"
    priority: 8
    auto_seeds:
      - char: l_lawliet
        topic: "第二例。同样的倒法，同样的清晨。一个样本是意外，两个样本是模式——委托人预付一年酬金等的就是它。现在的问题只剩一个：模式的选择标准是什么？倒下的两个人有什么共同点——以及，在谁的眼里他们有共同点？"
        urgency: high
      - char: light
        topic: "第二次了。风声里第一次出现'规律'这个词——有人在数。你比谁都清楚这意味着什么：从现在起，每一次选择都会让那条看不见的线更清晰一分。要么停，要么让线指向别处。你听见自己心里已经有了答案。"
        urgency: high
      - char: asuka
        topic: "又倒了一个。两个了。镇上开始有人晚上不敢一个人走。你嘴上说'蠢死了，病而已'——但你昨晚锁了两次门。"
        urgency: med
    on_trigger:
      hint: |
        风声机制已自带模式描述（第 2 例起）。director 不要替任何人得出结论，
        不要把"怪病"两个字升级成"有人在做这件事"——那句话必须从角色嘴里说出来。

  # ═══ 拆穿后：指控摆上台面，全镇被迫选边 ═══
  - id: kira_after_expose_showdown
    description: "拆穿后 — L 与 light 之间的账当面翻开，小镇再也装不回'一切如常'"
    preconditions:
      all:
        - "extras.kira.victimCount >= 1"
      any:
        - "characters.light.unresolvedWith.l_lawliet | length >= 1"
        - "characters.l_lawliet.unresolvedWith.light | length >= 1"
    priority: 9
    auto_seeds:
      - char: light
        topic: "话已经当面说开了。复盘每一步：破绽露在哪里？对方手里是推理还是证据？这两者天差地别——推理可以被更好的推理压过去，证据必须被处理。以及最要命的问题：接下来的每一天，你的'如常'本身就是表演。"
        urgency: high
      - char: l_lawliet
        topic: "指控说出口就收不回了。现在是两个人的倒计时：你要在对方消化完震惊之前钉死链条上缺的那一环；对方要在你钉死之前让你变成'那个污蔑好学生的怪人'。镇上的每一双眼睛都是筹码。"
        urgency: high
      - char: lelouch
        topic: "棋盘上两个玩家当面摊牌了。你在旁观席上看得清楚：无论哪边赢，赢家接下来都会需要盟友，输家会需要替罪羊。站哪边、什么时候站、要不要让他们知道你早就看出来了——这三道题的答案决定你在这个镇上的下半场。"
        urgency: med
    on_trigger:
      hint: |
        对峙之后的走向全归角色。director 不制造"审判大会"，不安排任何人表态，
        只维持物理条件：让镇上的人今天有机会在同一屋檐下碰见彼此。
