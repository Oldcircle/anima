# 最后一班船 — 初始世界状态（狗血版）
#
# 时间锚点: 第 1 天清晨。距离末班船启航还有 3 个游戏日。
# Day 1: 重聚 + 各自的"现状"暴露（订婚 / 东京 / 孩子照片）
# Day 2: 三重秘密互相撕开（一夜情 / 绝症 / 孩子的爸是谁）
# Day 3: 末班船汽笛 + 三人必须各自做出选择

active_phase: peaceful

unresolved_events:
  - id: forced_eviction_announcement
    summary: |
      昨天国家征收令送达 — 海边小镇被列入填海工程范围。
      3 天后末班船启航，任何人不得继续留在岛上。
      镇上居民大部分已经在过去几周走光。
    involved: [asuka, shinji, rei]
    visible_to: "*"

  - id: ten_years_ago_couple
    summary: |
      10 年前真嗣和明日香是恋人。镇上人人都知道。
      然后明日香一夜之间消失去了东京，没说一句话。
      真嗣等了 10 年没等到一封信。
    involved: [asuka, shinji]
    visible_to: "*"

  - id: shinji_rei_engagement
    summary: |
      两年前真嗣终于"接受"明日香不会回来，和绫波丽订了婚。
      婚礼原本定在下个月。征收令一来，婚礼也悬了。
      镇上人都觉得真嗣是"找了个温柔的人凑合"，连绫波丽自己也这么想。
    involved: [shinji, rei]
    visible_to: "*"

  - id: asuka_real_reason_left
    summary: |
      10 年前明日香离开的真正理由：她发现自己怀了真嗣的孩子。
      就在她准备告诉真嗣的那个晚上，她无意中看到绫波丽从真嗣家后门出来，
      头发乱着，脸是红的。她当场转身，第二天买了去东京的票。
      她从未告诉任何人。孩子今年 9 岁，叫"凉"，留在大陆的外祖父母家。
      她钱包里有一张孩子的照片，这次回来随身带着。
    involved: [asuka]
    visible_to: [asuka]

  - id: rei_drunk_night_secret
    summary: |
      10 年前的某个夜里，绫波丽喝醉了去找真嗣。两人发生了一次。
      第二天真嗣什么都不记得（他也喝了），但绫波丽全程清醒。
      她背着这个秘密 10 年。她隐约觉得明日香的离开和那一夜有关，
      但她不敢去查证。她答应嫁给真嗣，一半是补偿，一半是惩罚自己。
    involved: [rei]
    visible_to: [rei]

  - id: rei_terminal_diagnosis
    summary: |
      三个月前医生告诉绫波丽她得了无法治愈的病，最多还有半年。
      她没告诉任何人。她答应这场婚礼，是想在走之前给真嗣留个"已经被爱过"的印象，
      让他不至于一辈子还在等明日香。
      她随身带着诊断书，藏在大衣内袋。
    involved: [rei]
    visible_to: [rei]

  - id: town_already_empty
    summary: |
      镇上其他居民几乎走光了。咖啡馆昨天关了门，面包店上周就关了。
      街上空空荡荡，只有这 3 个人和几只猫还在。
      整个世界都在催促他们做决定。
    involved: [asuka, shinji, rei]
    visible_to: "*"

character_relationships:
  - { a: asuka, b: shinji, level: 95, type: "10 年前的恋人 (未了结)", bond: "ex_lover" }
  - { a: shinji, b: asuka, level: 90, type: "10 年前的恋人 (从未真正放下)", bond: "ex_lover" }
  - { a: shinji, b: rei, level: 65, type: "未婚妻 (温柔但隔着距离)", bond: "fiancee" }
  - { a: rei, b: shinji, level: 75, type: "未婚夫 (愧疚 + 自我惩罚的爱)", bond: "fiance" }
  - { a: asuka, b: rei, level: 60, type: "曾经的闺蜜 (从未正面对质过那一夜)", bond: "estranged_friend" }
  - { a: rei, b: asuka, level: 50, type: "10 年的负罪感对象", bond: "guilt" }

initial_rumors:
  - content: "明日香这次回来据说带了张'侄子'的照片在钱包里，谁见了都说那孩子的眼睛像极了真嗣"
    source_char_id: ~
    spread_to: [rei]
  - content: "绫波丽这几个月经常一个人去诊所方向，回来眼睛是红的，问她她只摇头"
    source_char_id: ~
    spread_to: [shinji]
  - content: "10 年前明日香走的那天，有人看到绫波丽天没亮从真嗣家后门出来"
    source_char_id: ~
    spread_to: [asuka]
