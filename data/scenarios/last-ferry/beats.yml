# 最后一班船 — beats（狗血版）
#
# 三幕结构:
#   Day 1 = 重聚 + 订婚事实砸出来 + 孩子照片首次出现
#   Day 2 = 三重秘密互相撕开（一夜情 / 绝症 / 孩子）
#   Day 3 = 末班船汽笛 + 三人各自做选择

beats:
  # ═══════════════════ Day 1: 重聚 ═══════════════════

  - id: d1_morning_three_meet_at_bar
    description: "Day 1 早晨 — 10 年后第一次三人同框"
    preconditions:
      all:
        - "world.day == 1"
    priority: 10
    auto_seeds:
      - char: asuka
        topic: "10 年没见真嗣了。听说他还在这个破岛上。我才不在乎他...但如果碰到了，也许可以问问他这些年过得怎么样。"
        urgency: med
      - char: shinji
        topic: "明日香回来了。10 年没见。我现在有未婚妻了...如果碰到明日香，我该怎么面对她？"
        urgency: med
      - char: rei
        topic: "明日香回来了。我必须在她从别人嘴里听到之前，亲口告诉她我和真嗣订婚的事。"
        urgency: high
        target: asuka
    on_trigger:
      hint: |
        开场 beat。10 年没见。镇子已经空了，3 天后末班船启航。
        明日香不知道真嗣已经和绫波丽订婚 — 镇上没人写信告诉她，因为没人知道她在哪。
        真嗣不知道明日香为什么回来。绫波丽知道明日香回来了，心跳到嗓子眼。

        director 应该:
        1. inject_intent 给 asuka:
           "10 年了。我回来只是因为这破岛要拆了，外祖父母让我把一些东西收回去。
           顺便...也只是顺便...看看那个胆小鬼还在不在。Anta baka, 我才不在乎。
           先去酒馆喝一杯压压火气。"
        2. inject_intent 给 shinji:
           "听说明日香回来了。她回来了。我应该去见她吗？我...我有未婚妻了。
           我不能像 10 年前那样冲过去。但是...先去酒馆买点东西，万一遇到也只是巧合。"
        3. inject_intent 给 rei:
           "明日香回来了。我必须去酒馆。我必须先看到她，先开口，先告诉她'我和真嗣订婚了'，
           不能让她从别人嘴里听到。如果今天不说，我可能一辈子都说不出口。"
        4. add_unresolved_event id="three_converge_at_bar"
           summary="三人同时朝酒馆走去，10 年来第一次"
           involved=[asuka, shinji, rei] visible_to=*

  - id: d1_noon_engagement_revealed
    description: "Day 1 中午 — 订婚事实砸到明日香脸上"
    preconditions:
      all:
        - "world.day == 1"
        - "world.hour >= 11"
    fallback_deadline_day: 1
    priority: 9
    auto_seeds:
      - char: rei
        topic: "我必须现在就告诉明日香：我和真嗣下个月要结婚了。不能再拖了。"
        urgency: high
        target: asuka
      - char: asuka
        topic: "绫波丽看起来好像有话要跟我说。她的表情很奇怪...和真嗣有关系吗？"
        urgency: med
        target: rei
      - char: shinji
        topic: "绫波丽会不会告诉明日香我们订婚的事？我该怎么面对她的反应..."
        urgency: high
    on_trigger:
      hint: |
        三人在酒馆碰面。寒暄两句之后，绫波丽鼓起勇气说"我和真嗣下个月要结婚"。
        明日香脸上的笑当场凝固。她什么都没说。

        director 应该:
        1. add_unresolved_event id="engagement_announced_to_asuka"
           summary="绫波丽当面告诉明日香：她和真嗣下个月要结婚。明日香没说话就走了。"
           involved=[asuka, shinji, rei] visible_to=*
        2. set_observable_state 给 asuka:
           "嘴角抽了一下，笑容没收回来，但眼底已经空了"
        3. inject_observation 给 shinji:
           "你看见明日香听到'下个月结婚'四个字时手指猛地收紧 — 但她什么都没说。
           你心里有个声音说：她在意。但又有个声音说：你已经选了绫波丽。"

  - id: d1_evening_photo_glimpse
    description: "Day 1 傍晚 — 孩子的照片第一次被瞥见"
    preconditions:
      all:
        - "world.day == 1"
        - "world.hour >= 17"
    fallback_deadline_day: 2
    priority: 9
    auto_seeds:
      - char: asuka
        topic: "今天得到的消息太多了...真嗣居然要和绫波丽结婚。我需要一个人待着。钱包里凉的照片...我好想他。"
        urgency: high
      - char: rei
        topic: "我看到了明日香钱包里的照片...那个孩子的眼睛，和真嗣一模一样。这意味着什么？"
        urgency: high
    on_trigger:
      hint: |
        傍晚明日香一个人坐在海边，从钱包里拿出照片看。
        恰好真嗣路过看到她背影，但没看到照片正面，只看到她在哭。
        绫波丽更晚一些路过，看到照片掉在沙滩上 — 她捡起来，看到了那双眼睛。

        director 应该:
        1. inject_intent 给 asuka:
           "我得一个人待着。去海边。看看凉的照片。妈妈对不起你 — 你的爸爸要和别人结婚了。"
        2. inject_observation 给 shinji:
           "你路过海滩时看到一个红头发的背影坐在那里 — 是明日香。她肩膀在抖。
           你想过去，但你想到绫波丽，你停住了。"
        3. add_unresolved_event id="rei_sees_photo"
           summary="绫波丽在沙滩上捡到一张被风吹掉的照片 — 一个 9 岁男孩，
                   眼睛和真嗣一模一样。她把照片放回了原处，没说话。"
           involved=[rei] visible_to=[rei]
        4. set_observable_state 给 rei:
           "脸色比平时还白，手在大衣口袋里攥得发抖"

  # ═══════════════════ Day 2: 三重秘密 ═══════════════════

  - id: d2_morning_rei_confronts_self
    description: "Day 2 早晨 — 绫波丽决定先去找明日香"
    preconditions:
      all:
        - "world.day == 2"
    fallback_deadline_day: 2
    priority: 9
    auto_seeds:
      - char: rei
        topic: "昨晚那张照片...那个孩子是真嗣的。我必须去找明日香，告诉她10年前那个晚上的事——我喝醉了去找了真嗣。然后问她那个孩子是不是真嗣的。"
        urgency: high
        target: asuka
    on_trigger:
      hint: |
        昨晚那张照片让绫波丽一夜没睡。她想通了：那孩子是真嗣的。
        而且时间对得上 10 年前明日香离开。她必须问明日香一个问题，
        但她也必须先说出自己藏了 10 年的那一夜。

        director 应该:
        1. inject_intent 给 rei:
           "我得去找明日香。今天。我得告诉她 10 年前那个晚上的事。
           然后我要问她那个孩子是不是真嗣的。如果是 — 我必须退婚。
           我没有资格站在那个位置上。"
        2. set_observable_state 给 rei:
           "眼睛充血，但站得很直，像是终于下定了一个等了 10 年的决心"

  - id: d2_noon_two_confessions
    description: "Day 2 中午 — 绫波丽和明日香在花田对质（互相摊牌）"
    preconditions:
      all:
        - "world.day == 2"
        - "world.hour >= 11"
    fallback_deadline_day: 2
    priority: 10
    auto_seeds:
      - char: rei
        topic: "我必须告诉明日香：10年前的那个晚上，我喝醉了去找了真嗣，我们发生了关系。第二天真嗣什么都不记得。我背着这个秘密10年。"
        urgency: high
        target: asuka
      - char: asuka
        topic: "绫波丽，我要让你看一样东西。这是凉的照片，他今年9岁。是真嗣的孩子。10年前我看见你从真嗣家后门出来才离开的。"
        urgency: high
        target: rei
    on_trigger:
      hint: |
        两个女人 10 年来第一次单独面对面。
        绫波丽先说："10 年前的那个晚上，我喝醉了去找了真嗣。我一直没告诉任何人。"
        明日香愣住，然后笑了 — 是那种又疼又解脱的笑。
        她拿出照片："这是凉。9 岁。是真嗣的。10 年前我是因为看见你从他家出来才走的。"
        两人沉默很久。

        director 必须:
        1. add_unresolved_event id="mutual_confession"
           summary="绫波丽承认了 10 年前的一夜。明日香承认了凉是真嗣的孩子。
                   两人都没哭。她们答应彼此：今天傍晚之前都不告诉真嗣，让真嗣自己来选。"
           involved=[asuka, rei] visible_to=[asuka, rei]
        2. inject_observation 给 asuka:
           "你看着绫波丽的脸 — 她瘦得不像样。她眼底有种你以前没见过的东西。
           不是愧疚 — 是某种像在告别的平静。你突然有种不祥的预感。"

  - id: d2_evening_rei_collapses
    description: "Day 2 傍晚 — 绫波丽在广场晕倒，诊断书暴露"
    preconditions:
      all:
        - "world.day == 2"
        - "world.hour >= 17"
    fallback_deadline_day: 2
    priority: 100
    auto_seeds:
      - char: shinji
        topic: "绫波丽的诊断书...绝症...最多半年。我的未婚妻要死了。我什么都不知道。"
        urgency: high
      - char: asuka
        topic: "绫波丽晕倒了...诊断书写着绝症。她答应嫁给真嗣，是因为想在走之前给他留个'被爱过'的印象。天哪。"
        urgency: high
    on_trigger:
      hint: |
        【关键 climax 前置 — 必须发生】

        绫波丽今天透支太多。傍晚回家路上她在广场晕倒。
        明日香和真嗣几乎同时赶到。真嗣解开她大衣想让她透气，
        诊断书从内袋掉出来 — 真嗣捡起来看到，整个人僵住。
        他这才知道：他的未婚妻只剩半年。

        director 必须:
        1. add_unresolved_event id="rei_collapse_diagnosis_revealed"
           summary="绫波丽在广场晕倒。真嗣捡到她大衣里的诊断书 — 绝症，最多半年。
                   真嗣在所有人面前看完，没说一个字。明日香也看到了。"
           involved=[asuka, shinji, rei] visible_to=*
        2. set_observable_state 给 shinji:
           "手里捏着那张纸，指节发白，眼睛失焦"
        3. inject_observation 给 asuka:
           "你看到真嗣的脸 — 你 10 年没看到那种表情了。他不知道凉。他不知道一夜情。
           他什么都不知道。但他现在以为自己马上要失去绫波丽。
           你站在原地，手伸进口袋摸到那张照片，又抽回来。"

  # ═══════════════════ Day 3: Climax + Deadline ═══════════════════

  - id: d3_morning_shinji_must_choose
    description: "Day 3 早晨 — 真嗣彻夜未眠，明日香决定告诉他全部"
    preconditions:
      all:
        - "world.day == 3"
    fallback_deadline_day: 3
    priority: 100
    auto_seeds:
      - char: asuka
        topic: "今天必须告诉真嗣：你有一个9岁的儿子叫凉，在大陆等着你。然后让他自己选——跟我走还是留下陪绫波丽。"
        urgency: high
        target: shinji
      - char: shinji
        topic: "绫波丽要死了。明日香回来了。末班船今晚启航。我必须做一个选择。"
        urgency: high
    on_trigger:
      hint: |
        【climax 第一波 — 必须发生】

        末班船今晚 18:00 启航。真嗣彻夜没睡，坐在家里看着诊断书。
        明日香知道再不说就来不及。她带着照片去找真嗣。
        她不是为了把他抢回来 — 是为了让他知道凉的存在，让他自己选。

        director 必须:
        1. inject_intent 给 asuka (高紧迫):
           "今天必须说。不是为了赢绫波丽 — 她已经在告别了。
           是为了让真嗣知道有个 9 岁的孩子在大陆等着他，眼睛和他一模一样。
           然后让他自己选。Anta baka, 这次我不替你选。"
        2. inject_intent 给 shinji:
           "绫波丽要死了。我刚知道。我应该陪她走完最后半年。
           可是明日香回来了。可是她要走了。
           我这一辈子从来没替自己选过任何东西，今天必须选一次。"
        3. add_unresolved_event id="asuka_brings_photo_to_shinji"
           summary="明日香拿着凉的照片去真嗣家。她要告诉他孩子的事。"
           involved=[asuka, shinji] visible_to=*

  - id: d3_noon_rei_sets_them_free
    description: "Day 3 中午 — 绫波丽主动退婚，把真嗣还给明日香"
    preconditions:
      all:
        - "world.day == 3"
        - "world.hour >= 11"
    fallback_deadline_day: 3
    priority: 95
    auto_seeds:
      - char: rei
        topic: "我要退婚。真嗣不欠我半年的陪伴，他欠那个孩子9年的爸爸。我把戒指留在桌上。"
        urgency: high
        target: shinji
    on_trigger:
      hint: |
        绫波丽听说明日香带着照片去了真嗣家。她拖着身体追过去。
        她在门口停住，然后做了她一辈子里最主动的一件事：
        她推开门，把订婚戒指放在桌上，对真嗣说"我退婚。你欠我的，去陪那个孩子还。"
        然后她转身往诊所方向走。

        director 必须:
        1. inject_intent 给 rei (打破角色一刻):
           "我要去退婚。我从来没主动要过任何东西，所以今天我也只能用主动'放手'的方式存在一次。
           我要在他们三个的故事里，自己写完最后一句台词。
           真嗣，你不欠我半年的陪伴。你欠那个孩子 9 年的爸爸。"
        2. set_observable_state 给 rei:
           "嘴唇颤抖但腰杆挺直，像第一次走自己的路"
        3. add_unresolved_event id="rei_breaks_engagement"
           summary="绫波丽退婚。她把戒指留在桌上，独自往诊所方向走。"
           involved=[asuka, shinji, rei] visible_to=*

  - id: d3_evening_ferry_horn
    description: "Day 3 18:00 — 末班船汽笛，三人各自的最后选择"
    preconditions:
      all:
        - "world.day == 3"
        - "world.hour >= 18"
    fallback_deadline_day: 3
    priority: 100
    on_trigger:
      hint: |
        【最终 deadline beat — 必须发生】

        末班船的汽笛响彻港口。还有 30 分钟启航。
        码头上：明日香拿着两张船票，一张是她自己的，一张是临时为真嗣买的。
        真嗣站在码头入口，手里捏着照片。
        绫波丽在码头另一头远远站着，没靠近，只是想最后看一眼。
        每个人都必须现在做选择。

        director 必须:
        1. add_unresolved_event id="ferry_horn_blowing"
           summary="末班船汽笛长鸣 — 还有 30 分钟启航。三人都在码头。"
           involved=[asuka, shinji, rei] visible_to=*
        2. inject_observation 给所有 3 人:
           "汽笛声穿过整个码头。地面在震。这是 10 年所有秘密最后的截止时间。"
        3. set_observable_state 给 asuka: "握着两张船票，眼睛盯着真嗣"
        4. set_observable_state 给 shinji: "一只手照片一只手戒指，站在码头入口动不了"
        5. set_observable_state 给 rei: "远远站着，嘴角有种平静的微笑"
        6. mark_beat_resolved beat_id="d3_evening_ferry_horn"
           outcome="末班船启航。三个人的选择各自落定。"

  # ═══════════════════ Director 兜底 ═══════════════════

  - id: pacing_check_d2_noon
    description: "Day 2 中午兜底 — 如果剧情过于平淡"
    preconditions:
      all:
        - "false"
    fallback_deadline_day: 2
    priority: 1
    on_trigger:
      hint: |
        Day 2 中午世界仍然太平淡。注入一个推动剧情的扰动:
        - 让明日香的钱包掉在咖啡馆，绫波丽再次看到照片
        - 或让真嗣无意中听到镇上最后一个老人提起"绫波丽最近常去诊所"
