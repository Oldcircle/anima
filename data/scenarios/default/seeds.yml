# default 本体 — 初始信息图（DESIGN-revival §4 D 件）
#
# 七卡的戏剧资产此前全睡在 prose 里（default 是空壳）。这里把四条钩子落成账：
#   asuka 被弃真相 —— 从 asuka.yml 卡文挪出（visible_to 不含本人：她自己不知道，
#                     知道的人捏着这张牌——戏剧反讽的正确形状）
#   senjougahara   —— 到期日（母亲的邪教债，月底大限）
#   lelouch        —— 密文线（断联的联络人，最坏情况倒计时）
#   shinji         —— 父亲钩子（师傅柜子里那只熟悉字迹的信封）
#
# 纪律：seeds 只造处境不写结果。说不说、查不查、扛不扛得住——全归角色。

unresolved_events:
  # ── 明日香被弃的真相：本人不可见（visible_to 泄漏教训——这行就是整场戏）──
  - id: asuka_abandonment_truth
    summary: |
      关于明日香·兰格雷，你从一封辗转到手的旧信里拼出了一件她本人不知道的事：
      她被送到这个小镇，官方说法是"锻炼独立性"——真相是她父亲的新女友嫌她碍事，
      她父亲顺水推舟把她打发得远远的。所谓"这里更需要我这种人"，是大人编给她的台阶。
      她还在等父亲的电话。电话不会来。
      这张牌捏在你手里：说出去是毁掉一个人，捏着不说是每天看她等一通不会来的电话。
    involved: [asuka]
    visible_to: [lelouch]

  # ── 战场原的到期日：母亲的邪教债 ──
  - id: senjougahara_collection_deadline
    summary: |
      母亲当年被邪教骗走全部财产，最后一笔"布施"折成了压在你名下的债。
      上周讨债的人捎来口信：月底之前凑不出两百金，他们就去找你父亲——
      那个已经被这件事榨干过一次的人。你没告诉任何人。
      你每天站柜台数着一天的工资，数得清清楚楚：按现在的速度，凑不齐。
      要么想别的办法，要么让别人知道你缺钱——这两件事你都讨厌。
    involved: [senjougahara]
    visible_to: [senjougahara]

  # ── 鲁鲁修的密文线：断联 ──
  - id: lelouch_cipher_silence
    summary: |
      和"远方那个人"约定每周一封的密文信，已经断了两周。
      可能性排下来只有三种：线被掐了；对方出事了；对方把你卖了。
      你压着没动，但每天早晨开店之前都会在心里算一遍同一道题：
      如果是最坏的那种，从对方开口到有人追到这个小镇，需要几天。
      答案一天比一天小。你需要钱，需要一条退路，也需要装作什么都没发生地端好每一杯咖啡。
    involved: [lelouch]
    visible_to: [lelouch]

  # ── 真嗣的父亲钩子：师傅柜子里的信封 ──
  - id: shinji_father_thread
    summary: |
      来镇上那天，父亲只留了一行字："去吧，别给人添麻烦。"
      上个月你替师傅收拾里屋柜子，瞥见最底层压着一只旧信封——
      上面的字迹和父亲的一模一样。师傅从没提过认识你父亲。你也没敢问。
      为什么父亲把你送到这家面包店？师傅知道什么？
      那只信封还在柜子最底层。你每次经过里屋都知道它在那里。
    involved: [shinji]
    visible_to: [shinji]
