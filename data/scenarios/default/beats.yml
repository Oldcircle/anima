# Default scenario — demo beats
#
# 这些 beats 主要是为了 N3 阶段证明 BeatEngine 能在真实 sim 中触发，
# 不是真正叙事内容。N4 引入 Director 后，触发的 beats 会真正改世界。
#
# 表达式参考 jexl 语法，可见 src/narrative/expression.ts。
#
# Context 字段：
#   world.day  game day (从 1 起)
#   world.tick 当前 tick
#   world.unresolvedEvents 未解决事件数组
#   world.tensionIndex 0..100
#   characters.<id>.disclosedSecrets / knownFacts / pressure
#   characters.<id>.relationships.<otherId>.{level,type,bond,trust}
#   characters.<id>.needs.<key>

beats:
  # 1. 第一天结束 — 永远会触发，作为 sanity check
  - id: day1_complete
    description: 第一天结束（sanity check beat，只要跑过 day1 就会触发）
    preconditions:
      all:
        - "world.day >= 2"
    priority: 1
    on_trigger:
      kind: milestone
      hint: 第一天的世界已经形成。

  # 2. 任意两人之间出现"紧密关系"
  - id: any_close_bond_emerged
    description: 世界中出现至少一对紧密关系（朋友/恋人/敌对）
    preconditions:
      any:
        - "characters | keys | length > 0"
    # 上面只是占位 — 实际触发条件在下面，等 N4 做了关系扫描再细化
    fallback_deadline_day: 5
    priority: 2

  # 3. 出现高度社交需求未满足的角色（pressure 替代）
  - id: someone_lonely
    description: 至少一个角色社交需求严重不足，可能产生戏剧
    preconditions:
      all:
        - "world.day >= 2"
    fallback_deadline_day: 4
    priority: 3
    on_trigger:
      kind: tension_check

  # 4. 紧张度达标
  - id: tension_rising
    description: 世界紧张度达到 20+
    preconditions:
      all:
        - "world.tensionIndex > 20"
    fallback_deadline_day: 7
    priority: 0

  # 5. fallback only — 第 3 天如果还什么都没发生
  - id: world_needs_nudge_day3
    description: 第 3 天 deadline 兜底，提醒 director 世界太平淡
    preconditions:
      all:
        - "false"  # 永远不会自然触发，只会走 fallback
    fallback_deadline_day: 3
    priority: 0
    on_trigger:
      kind: director_nudge
      hint: 已经第 3 天了还没有显著事件，考虑注入一个意外。
