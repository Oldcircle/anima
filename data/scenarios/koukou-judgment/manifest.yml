id: koukou-judgment
name: 扣扣审判 — 一周目第一章
description: |
  魔法少女监狱审判，弹丸论破式 Class Trial。
  14 名拥有"魔女因子"的少女被关在 500 年历史的孤岛监牢里。
  一周目第一章聚焦城崎诺亚之死和莲见蕾雅的审判。

  改编自酒馆角色卡《魔法少女的扣扣审判 1.1》。
  重要：本剧本不是原卡的高保真复刻——结构借用，发生方式涌现。
  Anima 改写策略见 IMPORT-koukou-judgment.md。

