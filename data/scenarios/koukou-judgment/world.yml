# 扣扣审判 — 世界观
# 提供给所有角色的共同 lore 背景

setting:
  era: 现代日本
  location_name: 魔女监牢岛
  description: |
    一座有 500 年历史的孤岛监牢。
    国家通过秘密检查，将体内检测出"魔女因子"的少女（约 15 岁左右）抓捕并秘密运送至此囚禁。
    岛屿四周被消除魔法的高墙环绕，无法逃脱。
    岛上自然丰茂，四季分明。

magic_system:
  概念: 魔女因子
  描述: |
    每个少女体内都有一种被称为"魔女因子"的超自然能量。
    它表现为各种"魔法"——液体操控、点火、怪力、视线固定等。
    魔女化是一个渐进过程，伴随精神压力增大，可能引发：
    - 无法抑制的杀人冲动
    - 妄想或幻觉
    - 完全失去人形（变成"残骸"）
  完全魔女化: |
    完全魔女化的个体会失去人形变成"残骸"——一种接近不死的怪物。
    残骸不会因为常规手段死亡，只能被冰封冷冻保存到地下。

prison_rules:
  daily_schedule:
    - { time: "06:00-10:00", phase: "自由时间（早餐）" }
    - { time: "10:00-12:00", phase: "监房滞留（巡逻/点名）" }
    - { time: "12:00-15:00", phase: "自由时间（午餐）" }
    - { time: "15:00-17:00", phase: "监房滞留（巡逻/点名）" }
    - { time: "17:00-22:00", phase: "自由时间（晚餐+淋浴）" }
    - { time: "22:00-06:00", phase: "外出禁止/就寝" }

  general_rules:
    - 自由时间外必须停留在指定监房，违反者送惩罚房 2 天
    - 衣服每天丢弃在淋浴间垃圾滑槽
    - 用餐限每日 3 回，必须在自由时间内于食堂进食
    - 看守常时巡回，对看守抵抗或暴力，惩罚立即执行

  witch_trial:
    trigger: 监狱岛内发生杀人事件
    process:
      - 囚人讨论、投票，得票最多者被认定为【魔女】
      - 该魔女被处刑（特殊方式，杀死不会轻易死亡的完全魔女）
      - 若全员一致认定【不存在犯人】并提供合理证据，可回避处刑
      - 魔女不成立则参加者全员处刑

managers:
  - id: warden
    role: 典狱长
    description: 一只巨大的猫头鹰；以广播形式传达指令；性格懒散随意但残酷
  - id: guard
    role: 看守
    description: 沉默的人形机械；在走廊巡逻；遇到违规者立刻拘押

surveillance:
  - 看守在所有公共区域常态巡逻
  - 森林边缘有监视猫头鹰
  - 22:00 后所有监房和主要出口自动上锁

contacts:
  smartphone:
    description: 全员配发智能手机；具有相机、录音、音乐功能；内置【魔女图鉴】应用
    capabilities:
      - 查看地图、审判规则、囚人信息、证据品
      - 囚人间可通话/聊天（记录可互查）
    limitations:
      - 无法联络外界
      - 无法上网
