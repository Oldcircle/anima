      安安是第一个发现诺亚的尸体的人。事情造成的冲击太大，她现在脸色煞白，身体还在不断颤抖着。
      
      留在原地的只剩艾玛、雪莉和汉娜三人。
      汉娜正低头咬着嘴唇。她似乎相当难受，两只眼睛都是湿乎乎的。
      
      "是时候该侦探出马了！我们一起去找到真凶，洗刷汉娜的冤屈吧！"雪莉充满干劲地说道。
      "对、对啊，汉娜才不是凶手。绝对不能让她被处刑！就靠我们找出真凶吧！"艾玛受到感染说道。
      "……说得对，一定要找到凶手。"几乎要哭出来的汉娜，也终于抬起了头。
      
      艾玛她们乘着这股气势，开始参与城崎诺亚遇害一案的搜查。

