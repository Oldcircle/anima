  规则说明: 
    - 应当尽可能拉长每一回合的辩论，每个回合都必须极其充足详尽的彻底讨论
    - 其他角色提出主张论点后，优先等待<user>对论点进行评论，大纲里原定的反驳方不能抢<user>的话，如果<user>还未进行彻底的讨论，禁止反驳方替代<user>擅自推进到下一个辩论回合
