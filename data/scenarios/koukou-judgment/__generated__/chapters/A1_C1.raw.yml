  审判概述: |
    11位少女站在证人席上，彼此试探着，向对方投去尖锐的视线。
    典狱长宣布魔女审判开庭，要求在限定时间内选出魔女。
    艾玛在梅露露的支持下，决心找出真正的凶手。
  
  辩论回合:

    - 回合序号: 1
      议题: "蝴蝶画的含义"
      
      主张方: "雪莉"
      主张内容: |
        雪莉指出现场的蝴蝶血画是诺亚的死亡讯息。
        她认为蝴蝶图案指向玛格——因为玛格的衣服上有蝴蝶装饰。
        因此雪莉指控玛格是凶手。
      
      反驳方: "艾玛"
      反驳内容: |
        艾玛出示安安素描本上的蝴蝶画，证明这是诺亚早就画好的护身符。
        安安作证：诺亚说她只有蝴蝶可以用魔法控制，蝴蝶画是为了保护安安不遇上可怕的事。
        蝴蝶并非指代凶手，而是诺亚的标志性图案。
      
      结论: "蝴蝶血画不是死亡讯息，无法用来指认凶手。雪莉撤回对玛格的指控。"

    - 回合序号: 2
      议题: "自杀还是他杀"
      
      主张方: "玛格"
      主张内容: |
        玛格提出诺亚可能是自杀。
        理由：现场是纯白色画布，诺亚将自己的身体用作最终作品的画具。
        内心疲惫的天才艺术家选择用凶器刺穿自己的心脏，完成人生最后的遗作。
      
      反驳方: "艾玛"
      反驳内容: |
        艾玛指出地板上有一道划痕，但箭头上没有沾到颜料。
        如果划痕是箭造成的，箭头应该沾有从地板刮下的颜料。
        这说明存在其他造成划痕的东西，而凶手把它拿走了。
        因此有第三人在场——这是他杀，不是自杀。
      
      结论: "地板划痕证明存在第三人，诺亚是被他杀的。"

    - 回合序号: 3
      议题: "凶器的来源"
      
      主张方: "亚里沙"
      主张内容: |
        亚里沙认为凶手是从远处投掷箭矢杀死诺亚的。
        凶手可能有投掷飞镖的经验，从房间外投掷进去。
      
      反驳方: "艾玛"
      反驳内容: |
        艾玛指出那支箭是弩枪的箭，不是普通弓箭。
        奈叶香作证：弩枪的箭在两天前就不见了，弩枪本体是昨天才不见的。
        雪莉承认是她偷走并拆解了弩枪，但偷的时候箭已经不在了。
        艾玛和梅露露昨天傍晚就发现了弩枪零件，证明弩枪在案发前已被拆解。
      
      结论: "弩枪在案发前已被拆解，无法用于射击。凶手另有作案手法。"

    - 回合序号: 4
      议题: "密室谜题——谁能进入现场"
      
      主张方: "蕾雅"
      主张内容: |
        蕾雅指控汉娜是凶手。
        理由：房间涂满白色颜料且没有足迹，凶手必须飞在空中才能接近诺亚。
        汉娜是唯一会飘浮魔法的人，因此凶手只能是她。
      
      反驳方: "艾玛"
      反驳内容: |
        艾玛指出现场留下了地板划痕，说明凶手并非完全不留痕迹。
        如果凶手会飞，不管是箭还是发带都可以不留痕迹地回收。
        但实际上现场留下了痕迹，说明凶手不会飞。
      
      结论: "地板划痕证明凶手不会飞，汉娜的嫌疑被排除。"

    - 回合序号: 5
      议题: "时间线重构——推定死亡时间"
      
      主张方: "可可"
      主张内容: |
        可可声称直播结束后路过诺亚房间时，听到脚步声，认为诺亚还活着。
        因此凶案发生在就寝时间（22:00）之后。
        若如此，凶手只能是没有不在场证明的艾玛或安安。
      
      反驳方: "艾玛"
      反驳内容: |
        艾玛指出照片证据：现场没有足迹。如果曾有脚步声，必然会留下足迹。
        米莉亚承认当时聊得火热，并没有听到确切的脚步声。
        且现场充满刺鼻的颜料味，掩盖了尸体的血腥味，导致三人路过时未察觉异常。
        就寝后房门上锁，无人能进出，因此诺亚在直播前（20:00-21:00）已遇害。
      
      结论: "推翻可可的证词，确定诺亚死于20:00-21:00之间。"

    - 回合序号: 6
      议题: "不在场证明——锁定嫌疑人"
      
      主张方: "众人"
      主张内容: |
        整理所有人在晚上8-9点的不在场证明：
        - 可可、米莉亚：在准备直播，互相证明
        - 艾玛、雪莉、汉娜、梅露露、奈叶香、亚里沙、玛格：在娱乐室找发带
        - 安安：在医务室
        唯一没有不在场证明的人是蕾雅。
      
      反驳方: "蕾雅"
      反驳内容: |
        蕾雅声称自己去了食堂，但记不清具体做了什么。
        她强调自己不会飞，无法接近涂满颜料的房间中央的诺亚。
        没有不在场证明不代表就是凶手，需要确切证据。
      
      结论: "蕾雅是唯一没有不在场证明的人，但她以无法接近诺亚为由否认。"

    - 回合序号: 7
      议题: "长枪假说——作案手法"
      
      主张方: "艾玛"
      主张内容: |
        艾玛提出凶手制作了临时长枪从门外刺杀诺亚。
        凶手用扫帚柄、剑、剑鞘组合成长棒，在顶端绑上弩箭，用发带固定。
        这样不需要进入房间就能刺杀诺亚。
        而蕾雅是唯一携带剑的人，只有她能做到。
      
      反驳方: "蕾雅"
      反驳内容: |
        蕾雅反驳说这只是假设，没有证据证明长枪存在过。
        也没有证据证明是她制作的，其他人也可以用多个扫帚柄组合。
      
      结论: "长枪假说成立，但需要更多证据证明蕾雅是凶手。"

    - 回合序号: 8
      议题: "发带证据——长枪存在的证明"
      
      主张方: "艾玛"
      主张内容: |
        艾玛出示亚里沙在湖边捡到的奈叶香发带。
        发带上沾有血迹和白色颜料，证明它曾在案发现场使用。
        发带是用来绑紧长枪各部件的，作案时发带松开导致长枪解体。
        这就是地板划痕的成因——长枪解体时，剑尖刮到了地板。
      
      反驳方: "蕾雅"
      反驳内容: |
        蕾雅承认发带曾在现场，但坚称这不能证明是她做的。
        她展示自己的剑尖，上面没有颜料痕迹。
        蕾雅坚持发带已被丢弃，且剑尖干净，没有直接证据指向她是凶手。
        而且蕾雅假设就算是自己组装了长枪，但诺亚不可能原地等死。
        玛格认为需要确定蕾雅是凶手那么她的魔法需要满足三个条件
        -平时能伪装成魅惑魔法
        -就算在面前做杀人准备也无法抵抗
        -其他人经过凶杀现场时察觉不到其中的尸体
      
      结论: "推论逼近真相，但蕾雅通过擦除剑尖颜料销毁了直接证据，陷入僵局。"

    - 回合序号: 9
      议题: "魔法真相——固定视线"
      
      主张方: "艾玛"
      主张内容: |
        艾玛指出蕾雅的魔法不是"魅惑"而是"固定视线"。
        这个魔法可以解释三个疑点：
        1. 为什么蕾雅能伪装成魅惑——让人无法移开视线会产生心跳加速的错觉
        2. 为什么诺亚面对凶手毫无反抗——她的视线被固定在天花板上
        3. 为什么可可和米莉亚路过时没看见尸体——她们的视线被固定在蕾雅身上
      
      反驳方: "蕾雅"
      反驳内容: |
        蕾雅反驳说这只是推测，没有确切证据。
        她呼吁大家相互信任，不要被阴谋论蒙蔽。
        没有证据就不应该投票给她。
      
      结论: "魔法假说可以解释所有疑点，但蕾雅坚持没有直接证据。"



    - 回合序号: 10
      议题: "决定性证据——苹果上的颜料"
      
      主张方: "艾玛"
      主张内容: |
        艾玛想到直播时蕾雅用剑表演杂技戳苹果。
        如果当时剑尖还沾着颜料，颜料就会转移到苹果上。
        直播回放没有拍到剑尖，但收拾的米莉亚应该还保留着那颗苹果。
      
      证据确认: |
        米莉亚从口袋里拿出那颗苹果——上面确实沾有白色颜料！
        这是蕾雅作案的决定性证据。
      
      结论: "苹果上的白色颜料证明蕾雅的剑尖曾接触过案发现场的颜料，蕾雅是凶手。"
  
  真凶认罪:
    认罪者: "莲见蕾雅"
    认罪内容: |
      蕾雅承认是她杀了诺亚，详细交代了作案过程：
      
      "碰巧，我拿着弩枪的箭。本来我想把它藏起来，避免有人把它当凶器。"
      "碰巧，我捡到了奈叶香的发带，放到了口袋里。"
      "碰巧，我路过那房间的时候，里面涂满了还未干的颜料。"
      
      "我的魔法是固定视线。我把诺亚碰巧望着天花板的视线直接固定住了。"
      "她到死为止……都一直在望着空无一物的天花板。"
      
      "我拆解了旁边的扫帚，跟我携带的剑组合到一起，在顶端绑了那支箭。"
      "用顶端的箭，刺穿了动弹不得的诺亚的心脏。"
      
      "杀死诺亚后，我佯装无事发生，参加了可可的直播。"
      "在回去的路上，我将可可和米莉亚的视线固定在我身上，让她们看不见尸体。"
      
      "——感谢大家观看，我最后的一场戏。"
  
  投票结果: "蕾雅认罪后，开始在手机上投票，全体一致投票给莲见蕾雅"

  阶段切换: 投票结束后，更新阶段变量并推进阶段至处刑尾声


# ====== A1_C1_处刑尾声 ======

处刑:
  
  处刑对象: "莲见蕾雅"
  处刑方式: "铁处女（天使像）"
  
  处刑前的对话:
    
    - 场景名: "蝴蝶的真正含义"
      
      场景复述: |
        艾玛质问蕾雅为什么要杀诺亚，蕾雅露出一丝笑容：
        "跟诺亚同一间房的安安不是晕倒了吗？所以我就想，我必须要保护安安。"
        "看来，我想要守护弱小的感情，最终驱使我犯下了命案。"
        
        然而安安开口了："不对……不是这样的。蕾雅，你搞错了。"
        "吾辈，才不弱小……诺亚她，给了吾辈一幅画……她说，是护身符……"
        
        安安流泪诉说：诺亚说她只有蝴蝶可以用魔法控制。
        "她说，为了不让吾辈遇上可怕的事，在我的素描本上也画了蝴蝶，当作是护身符。"
        "就连流的血，也为了让大家不感到害怕……都变成蝴蝶了……！"
        
        玛格轻声说道："蝴蝶的内涵是，不死、不灭——"
        "诺亚的死亡讯息，或许我们已经都收到了。那就是'请大家一定要活着'。"
        
        安安继续说："真正想要保护大家的，是诺亚才对，不是吗……！"
        蕾雅受到冲击，当场跪倒在地："怎么会，我，竟然——"
    
    - 场景名: "蕾雅的真正动机"
      
      场景复述: |
        典狱长宣布开始执行处刑，天使像从地下升起。
        天使像的内部布满了大量纤长的利刺——这是铁处女。
        
        蕾雅开始拼命挣扎："不要啊！求求你！我不要进【这个】里面啊！"
        "用其他方式处刑好吗！！这个真的不行！！因为这样大家不是都看不见我吗！！"
        
        可可露出险恶的笑容："我知道你杀死诺亚的动机了。"
        "你会杀死诺亚，就是因为你最受人瞩目的地位被打破了，对不对？"
        
        雪莉恍然大悟："【气球】才是动机！她的知名度比当艺人的蕾雅还要高多了！"
        
        蕾雅的假面被揭下，露出从未见过的可怜表情。
        她的脸生出丝丝裂缝，手指以超出常理的速度伸长——开始魔女化。
        
        "啊，对，我承认！我想变得引人注目！"
        "我一定要是最显眼的那个！所以，我没法原谅她！"
        "城崎诺亚把舞台的主角抢走了，所以我就想，一定要杀了她！"
        "要是被关进这里面，大家不就看不到我了吗！！"
        "多注视我好吗！求你们只看我！不要啊啊啊！！"
  
  身世回溯:
    
    标题: "请注视我吧"
    
    回溯内容: |
      莲见蕾雅必须变得比所有人都要引人注目。
      在她幼年时，母亲卧病在床，封闭了自己的内心。一切从那时开始。
      
      母亲从不直视任何人——也不说话——甚至连女儿的存在都未能察觉——
      
      幼小的蕾雅，常常来到母亲的病房中和她说话。
      "没关系的，没什么好怕的！"
      "蕾雅会保护妈妈的！"
      "我一定会治好妈妈的病！"
      "所以，所以……求你，看一看蕾雅吧！"
      
      曾经有且仅有一次，母亲看了病房内的电视。电视上正好播映着舞台剧。
      或许，母亲只是单纯将视线对准到了电视上而已。
      尽管如此，映入母亲眼帘中的影像，却成了蕾雅心中的希望。
      
      "只要站在那里，站在最显眼的地方，我一定能得到她的注视。"
      
      这份愿望，成为了魔法。
      蕾雅获得了一份神奇力量，能用来得到他人的注目。
      
      可是，不管用怎样的魔法——母亲始终没有看见蕾雅。
      
      "我做得还不够。我还要变得更显眼才行。要比谁都要引人注目才行。"
      "必须要除掉比自己还要引人注目的人。"
      
      于是，在蕾雅的眼前，又出现了一位比自己更显眼的人物——城崎诺亚。
      
      有人在蕾雅的耳边悄声说道：
      "不除掉引人注目的她，你就没法成为全场焦点哦？真可怜啊。"
      
      就在那时，蕾雅决定要杀死城崎诺亚。
  
  处刑执行:
    
    场景复述: |
      天使像合上了盖子，将蕾雅的惨叫声一同封印在其中。
      
      从天使像的下方，点滴渗出了血液，流淌在底座之上。
      讽刺的是，鲜活的红颜色全都化作了美丽的蝴蝶。
      
      不管流了多少血，蕾雅似乎都并未死去。
      只有天使像不断的颤动着，血液不断的流淌着。
      
      蕾雅持续的惨叫声，最终变成了可怕的低吼声。
      完全化作异形后的低吼声，已不再听得出蕾雅的声音了。那简直就是野兽般的咆哮。
      
      典狱长宣言："由于她已顺利变成魔女的残骸，接下来她会被关进永恒的囚牢之中。"
      
      机关开始运作，将处刑台降至地下，移出了现场。
      异形的咆哮声随着地板的闭合完全消失不见了。
      中心处原有的底座恢复了原位——就好像自始至终那里从没发生过任何事一样。
      
      艾玛低着头，渗出了泪水。
      而她的嘴角则是稍微地——似乎得到了满足般地上扬着。
      耳边传来一道声音："做得好。"

尾声:
  
  场景名: "枪声响起"
  地点: "审判庭"
  
  场景复述: |
    审判结束了。
    少女们互相观察着对方的表情，互相提防着，慢吞吞地动身。
    
    典狱长宣布："如果之后再发生凶杀案的话，就会开展魔女审判。"
    "在下次审判到来之前，请大家跟往常一样，老实规矩地作为囚犯生活下去吧。"
    "魔女审判，就此闭庭。"
    
    但此时——有一位少女作出了超乎所有人意料的举动。
    
    一道枪声响彻了审判庭。
    
    少女们瞬间再次陷入了恐慌，身体因紧张动弹不得。
    而子弹贯穿的则是——正要飞离此处的典狱长。
    那一发子弹已完全要了它的命，落在地板上的典狱长陷入了沉默，一动也不动。
    
    架起枪的那位少女静静开口说道：
    
    "这出闹剧究竟要演到什么时候？"
    "这场死亡游戏的幕后黑手，其实就在我们之中，没错吧？"
  
  关键人物: "黑部奈叶香"
  
  悬念设置: |
    奈叶香击落典狱长，质问"死亡游戏的幕后黑手就在我们之中"。
    这暗示着监牢中存在内鬼，死亡游戏的真相远比表面复杂。
    第一章在这个悬念中落幕。
  阶段切换: 尾声演绎完毕后，【更新变量设置章节为2，并重置阶段为日常，更新场景名称为01-枪声与质问】

下一章开头场景详情，更新章节为第二章，衔接此场景演绎剧情:
    - 场景名: "01-枪声与质问"
      地点: "审判庭"
      在场角色:
        - "全体少女（11人）"
        - "典狱长"
      
      需要扩写的大纲: |
        蕾雅被处刑后，审判结束。少女们惊魂未定，互相观察着对方的表情，充满了不信任与提防。
        典狱长无情地宣布："如果之后再发生凶杀案的话，就会开展魔女审判。"
        
        就在典狱长准备飞离之际——一道枪声响彻审判庭。
        子弹精准贯穿了典狱长，它落在地板上一动不动。
        
        开枪的是黑部奈叶香。她神情冷峻，架着冒烟的步枪："这出闹剧究竟要演到什么时候？"
        奈叶香断言："这场死亡游戏的幕后黑手，其实就在我们之中，没错吧？"
        她指出有人在诱导大家变成魔女，就在旁边看着取乐，那个人才是监牢真正的管理者。
        
        众人的反应各异：
        玛格冷笑："不惜冒着被杀甚至被处刑的风险也要潜伏在我们之中，那她真是低级趣味啊。"
        亚里沙急忙撇清："事先声明，我可不是幕后黑手！"
        安安举起素描本：『吾辈也不是！』
        可可则一脸无所谓："除了我以外全都处刑不就好了？"
        
        汉娜虽然害怕枪，但还是硬着头皮质问奈叶香："为什么你会知道有幕后黑手！？"
