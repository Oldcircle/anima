          雪莉瞪大眼睛愣了一下，然后摆出羞涩的微笑："是吗……原来我会用魔法啊。哎呀，好羞人耶～"
          
          汉娜则表演了飘浮魔法，只能飘起10厘米左右，移动一点点就累得上气不接下气。
          汉娜说："我有听都市传说讲过。拥有魔法的人可能会变成魔女，所以要在15岁的时候送到监牢里。我本来是不想被关进监牢，才一直隐瞒了这份能力……"
        

      - 场景名: "07-安安晕倒"
        地点: "地下过道"
        在场角色:
          - "艾玛"
          - "诺亚"
          - "安安"
          - "蕾雅"
        
        场景复述: |
          艾玛再次来到诺亚的牢房前，发现整个室内被涂成一片通红，散发浓烈的喷漆气味。
          诺亚解释说她想把之前的画涂掉重画，结果全都变成这样了。
          
          安安回到自己的房间——她和诺亚是室友。
          看到被涂成鲜红的房间和刺鼻的气味，安安脸色苍白，晕倒了。
          
          蕾雅轻松地公主抱起安安，英姿飒爽地将她带往医务室。
        


      - 场景名: "08-监牢探索开始"
        地点: "监牢各处"
        在场角色:
          - "艾玛"
          - "雪莉"
          - "诺亚"
        
        场景复述: |
          雪莉一大早就来叫醒艾玛，提议一起探索监牢。
          艾玛看到隔壁诺亚还在画画，安安不在——应该还在医务室。
          诺亚房间里的喷漆画细节丰富，颜色美丽。
          
          雪莉惊呼："是气球……！'气球'可是世界有名的街头艺术家哦！真实身份是个谜，从未有人见过他的真面目……没想到他就是诺亚耶！"
          诺亚承认了自己就是"气球"："嗯？哦～对哦～？嘿嘿～好羞人啊～"
          
          艾玛兴奋地说："这么有名的人被抓来，肯定会出大新闻！蕾雅也是艺人，警察肯定在到处找我们！"
          
          但雪莉冷静地分析："我感觉国家有在背后插手这个监牢的事哦。如果国家有在背后插手，警察应该不会出手。说不定，我们在外面已经被宣布死亡了哦。"
          
          艾玛无法接受："我们不可以坐以待毙！我们一定要把希罗遇害的消息告诉外面的人！"
          艾玛下定决心："我们先想想怎样越狱吧……多四处走走，找一下有没有比较好的越狱方法吧！"
        


      - 场景名: "09-娱乐室与图书室"
        地点: "二楼娱乐室、图书室"
        在场角色:
          - "艾玛"
          - "雪莉"
          - "米莉亚"
          - "玛格"
          - "可可"
        
        场景复述: |
          娱乐室设备齐全，米莉亚正在播放8mm胶片黑白电影。
          艾玛打开手机，看到可可"正在直播"。
          
          可可在直播中兴奋地介绍自己的兴趣是推活："推活正是我的人生！除了我推都没有活着的价值！其他人全都给我去死！"
          在场所有人几乎同时关闭了直播。雪莉吐槽："根本浪费时间呢。"
          
          在图书室，玛格正在用塔罗牌占卜。
          她拿出一张牌放在艾玛和雪莉面前——【塔】的正位："在不久的将来，会有某个人死去。"
          玛格警告道："你们也要小心周遭的事物。毕竟我们没法知道，哪个人的身上埋藏着杀意。"
          
          艾玛坚持相信不会发生凶杀案："我不觉得她们是会下手杀人的人！"
          玛格反问："你最熟悉的那位二阶堂希罗，不是比谁都要更早地展露出杀意了吗？"
          玛格的脸上仍堆着满面的笑容，可是她的话语就像一把锋利的刀，狠狠刺伤了艾玛。
        

      - 场景名: "10-医务室与中庭"
        地点: "医务室、中庭"
        在场角色:
          - "艾玛"
          - "雪莉"
          - "蕾雅"
          - "梅露露"
          - "安安"
        
        场景复述: |
          医务室里飘着沁人的香气，安安躺在床上。
          梅露露从中庭摘来香草泡茶，照顾着安安。
          
          蕾雅带艾玛和雪莉来到中庭——一个绿意满盈的庭院，四周被墙壁包围但没有天花板。
          
          典狱长出现，雪莉抓住机会提问。
          典狱长透露："这座监牢已经有500年历史了。当时这里不是囚禁魔女的地方，而是魔女们正常生活的大宅子。"
          "以大魔女为中心，许多魔女曾在这里幸福地生活着。"
          "某天人类来到这座岛上时，魔女们还在中庭开茶会欢迎他们……"
          说到这里，典狱长逃也似的飞走了。
        


      - 场景名: "11-惩罚室与亚里沙"
        地点: "地下惩罚室"
        在场角色:
          - "艾玛"
          - "雪莉"
          - "亚里沙"
        
        场景复述: |
          艾玛和雪莉来到地下深处的惩罚室，室内充满邪气的拷问工具。
          
          她们听到亚里沙的呻吟声："呜……该死的，开什么玩笑……放我出去！！"
          找到亚里沙后，发现她被绑在了十字架上，消耗了不少心神和体力。
          
          亚里沙透露："之前我往远离宅邸的方向逃跑，看到那边有一大堆怪物猫头鹰在监视。它们一发现我，马上就有看守赶过来了。越狱太难了。"
          "有一道很高的围墙，我想把它烧掉，但也做不到。有股神奇力量把我的火焰消除掉了……到底是怎样，该死。"
          
          亚里沙激动地喊叫："你是过来取笑我的对吧！滚蛋！！"
          艾玛和雪莉只好离开。雪莉说："根据规定，她明天就会被放出来了。"
        


      - 场景名: "12-逐渐习惯的生活"
        地点: "监牢各处"
        在场角色:
          - "全体少女"
        
        场景复述: |
          囚犯少女们遵照规定行动，各自以自己喜好的方式度过日常。
          她们逐渐开始习惯这座监牢内的生活。
          
          诺亚依然沉浸在画画中，几乎不来用餐。
          艾玛多次邀她吃饭，但她一门心思在画画上，根本不打算走出房门。
          不过安安倒是会来用餐，虽然脸色还是不太好，但渐渐有好转。
        

      - 场景名: "13-亚里沙的威胁"
        地点: "食堂"
        在场角色:
          - "全体少女"
        
        场景复述: |
          晚餐时，大家热衷于谈论诺亚是"气球"的话题。
          
          终于被放出惩罚室的亚里沙，神情比其他少女更加憔悴。
          她突然把餐盘摔在地上："你们吵死了。老是聊别人的八卦……！"
          "害我不爽的家伙，我要把你们全杀光！"
          
          蕾雅平静地问她是否受到危险想法的控制，愿意倾听她的烦恼。
          亚里沙咂舌离开："模范生给我闭嘴。我的事由我自己说了算。"
          
          汉娜拿着汤匙的手不断发抖。大家都很害怕有人会做出什么不好的事。
        


      - 场景名: "14-蕾雅的直播"
        地点: "监牢各处"
        在场角色:
          - "艾玛"
          - "雪莉"
          - "汉娜"
          - "蕾雅"
        
        场景复述: |
          晚餐结束后，艾玛、雪莉、汉娜三人去淋浴房洗澡。
          走在路上时，雪莉让大家看手机——蕾雅正在直播。
          蕾雅在直播中说："也为了团结，我觉得，我也应该定期开展直播。希望各位可以保持积极的心态，千万不要冲动行事。目前我们别无办法，只能遵守规定。但是，我们绝不屈服。我们一定要做到，所有人能活着离开这里。请放心，我一定会想办法实现。"
          
          艾玛的心被蕾雅充满力量的话语打动了。
          
          汉娜嘴上说着嫌弃："哼，这样的东西根本没有看的价值。"可视线还是紧紧盯着手机不放。
          雪莉逗她："汉娜，你这么拼命抢手机，意思是你其实很喜欢蕾雅，对不对～？"
          汉娜的脸涨得通红："你个猩猩女！快还给我！！"


      - 场景名: "15-外出探索"
        地点: "监牢外部"
        在场角色:
          - "艾玛"
          - "雪莉"
          - "汉娜"
        
        场景复述: |
          艾玛和雪莉决定去监牢外面认真转一圈，寻找越狱方法。
          
          从正门走出，眼前是青翠森林和花田。
          她们发现了3栋建筑物，门上挂着"火精之室"、"水精之室"、"地精之室"的牌子。
          雪莉推测这是给来视察的高层领导住的招待所。
          
          她们来到一堵高高的混凝土围墙前。艾玛尝试攀爬，但找不到落脚点。
          
          汉娜出现，告诉她们这里是座小岛——她闻到海浪气味，听到了波浪声音。
          汉娜激动地喊道："整座岛都被围墙围住！我已经受够了这个地方了！！"
          
          雪莉用力砸了一下围墙，但连一道裂痕都没有产生。
          雪莉吐了一下舌头："这堵围墙，好硬！！"
          汉娜吐槽："竟然想赤手空拳解决问题，你的想法也太不正常了吧！？"
          
          看守要过来了，三人全力飞奔逃回监牢。
        

      - 场景名: "16-垃圾桶里的零件"
        地点: "地下过道"
        在场角色:
          - "艾玛"
          - "梅露露"
        
        场景复述: |
          艾玛和梅露露在过道转弯处的水桶旁停下。
          梅露露准备把擦脸的手帕丢掉时，发现桶里有奇怪的东西。
          
          那是一些拆得十分零碎的、像机械零件一样的东西塞满了整个垃圾桶。
          艾玛不知道这是什么，但感觉有些奇怪。
        

      - 场景名: "17-诺亚的画与安安"
        地点: "诺亚的牢房"
        在场角色:
          - "艾玛"
          - "诺亚"
          - "梅露露"
        
        场景复述: |
          艾玛一如往常地往诺亚的房间里看了看。
          诺亚说大家都对她很好，有时会送饭，有时会陪她聊天。
          "为了报答大家，诺亚要加油画完这幅画。大家看到一定会喜欢。"
          
          艾玛问起安安的情况。梅露露说安安昨晚回房了，但今天身体又变差，还在医务室躺着。
          艾玛提议和安安换房间，梅露露觉得是个好办法。
        

      - 场景名: "18-弩枪失踪与发带失踪"
        地点: "会客厅、娱乐室"
        在场角色:
          - "艾玛"
          - "雪莉"
          - "汉娜"
          - "梅露露"
          - "奈叶香"
          - "亚里沙"
          - "玛格"
        
        场景复述: |
          奈叶香找到艾玛她们，告知会客厅的弩枪不见了。
          "昨天白天来的时候还在，今天来的时候就不见了。所以我猜是昨晚不见的。"
          而且奈叶香的发带也不见了，她以为是弄丢了，可有头绪的地方都找过了，还是没找到。
          奈叶香嘴上用平淡的口吻描述着事实，但手里却是紧握着拳头，并且微微颤抖着。
          "囚犯里有小偷，我不会放过她。"奈叶香眼神昏暗地宣言。这句话让艾玛感到脊背发凉。
          
          在娱乐室，奈叶香和亚里沙起了争执。
          奈叶香说："所有人之中你看起来最可疑。"
          亚里沙愤怒地抓住奈叶香的衣领："你搞什么，见人就说别人是小偷！？开什么玩笑啊你！我才想说你呢，你那把枪是搞什么鬼！？是从哪里弄到手的！？最可疑的是你才对！！"
          奈叶香冷静地回应："你总是在虚张声势，从来没想过认真直面其他人。"
          亚里沙高举起的拳头正在颤抖，互殴一触即发，现场的气氛十分紧张。
          
          艾玛慌忙站在她们两人中间劝架："你们两个等一下！冷静一下！要是真的打起来了，说不定会违反不能惹事的规定，被关进惩罚室的。"
          亚里沙和奈叶香似乎一时间想到了什么，心生怯意，然后各自拉开了距离。
          
          玛格在一旁看戏，说不管谁拿走什么东西都无所谓："我倒是认为，不管是谁拿走了什么东西都无所谓哦？"
          奈叶香尖锐的眼神转移到玛格身上："你也拿了不少东西到自己的房间里。是你偷了我的发带也不奇怪。"
          玛格笑着回应："发带？没见过呢。不过，如果是很漂亮的东西，说不定我会把它占为己有哦。"
          奈叶香又和玛格针锋相对，现场再次充满火药味。
        

      - 场景名: "19-案发前的最后目击"
        地点: "地下过道"
        在场角色:
          - "艾玛"
          - "亚里沙"
          - "蕾雅"
        
        场景复述: |
          直播开始前，艾玛在回房间的路上，被亚里沙撞到跌坐在地上。
          亚里沙看起来有些慌张，咂舌离开："啧……又是你。走路能不能不要做白日梦啊！"
          汉娜吐槽："明明是她自己撞上来的，真是没礼貌！"
          
          蕾雅出现，关心艾玛是否没事。
          她说错拿了安安的手机，请艾玛帮忙还给她："今天我去医务室的时候，不小心错拿了安安的手机。我等一下有直播要开……真是不好意思，希望你可以帮我还给她。"
          艾玛接过手机："嗯，这么点小事没关系的。我、我想说，我觉得蕾雅你在做的事情真的很棒！虽然我们意见不太一样……不过，我希望我们可以互相帮助。"
          蕾雅有些惊讶地瞪大了眼睛，不过很快便露出了一个温柔的微笑："谢谢你。"
        

      - 场景名: "20-蕾雅的联动直播"
        地点: "会客厅、医务室"
        在场角色:
          - "蕾雅"
          - "可可"
          - "米莉亚"
          - "艾玛"
          - "安安"
        
        场景复述: |
          艾玛把蕾雅错拿的手机还给安安后，安安向她递出了自己的手机——她的意思是想让艾玛陪她一起看直播。
          艾玛小心翼翼地坐在床边，把视线移到安安的手机上。
          
          蕾雅、可可、米莉亚三人开始联动直播。同时在线观众只有6人。
          可可全程亢奋地介绍蕾雅是知名艺人："今天我们竟然！迎来了！那位知名艺人莲见蕾雅，一起开联动台～！"
          米莉亚则一脸尴尬："请问……为什么要把大叔我喊来呢……"
          可可吐槽："你就是单纯用来暖场的！你就是个龙套！"
          
          可可想到让蕾雅表演杂技："接下来，我要把这颗苹果丢出去，而蕾雅就会用刺剑戳中它～！"
          蕾雅推脱不掉可可的恳求，最终还是表演了用刺剑戳中抛出苹果的杂技。真不愧是蕾雅，她轻易地就表演成功了。
          艾玛和安安也看直播看得很入迷。
          
          这时收到了典狱长的通知：马上就到就寝时间了，之后属于禁止外出时间，请迅速回到牢房内。
          直播结束时，米莉亚说："工作人员之后会好好品尝这颗苹果，我就把它好好收起来咯～……"她把那颗苹果放进了口袋。
          
          艾玛急忙赶回自己的房间，刚好踩点回到家。
          今天已经相当累了，她闭上眼睛，马上就深深堕入了梦中世界。
        
        阶段切换: 结束该场景时，更新变量并推进阶段至案发搜查

# ====== A1_C1_案发搜查 ======

案发:
  
  时间: "早"
  
  场景名: "发现诺亚的尸体"
  地点: "诺亚的牢房（地下）"
  在场角色:
    - "夏目安安（第一发现者）"
    - "樱羽艾玛"
  
  需要扩写的大纲: |
    第二天早晨，艾玛早早醒来，走出房门。
    地下包裹在一片寂静之中，其他少女大概还没睡醒。
    
    安安从医务室方向走来，准备回自己的房间。
    她低着头走路，走到房门前才抬起头来——
    
    "啊、啊、啊……！"安安震惊地瞪大眼睛，第一次喊出声来。
    "啊啊啊啊啊啊啊啊啊啊——！！"
    
    艾玛跟着望向隔壁的房间，看到了令人窒息的景象。
    
    最喜欢画画的少女，城崎诺亚，死了。
    那双充满好奇心的可爱眼睛永远地闭上，再也不会看见任何色彩了。
    失去温度和血液的身体好像一件瓷器，又好像一只做工精美的洋娃娃，美丽而又脆弱。
    
    而用喷漆涂成的纯白色画布上，画有一幅画——
    那是由诺亚自身流出的大量鲜血画成的一幅画。
    
    "蝴……蝶……？"
    
    许许多多红色的蝴蝶，在诺亚的身边轻盈飞舞着。
    这就是城崎诺亚画的最后一幅画。多么残酷，多么美丽，多么荒诞无稽。
    
