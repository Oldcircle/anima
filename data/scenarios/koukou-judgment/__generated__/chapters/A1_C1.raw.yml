典狱长宣布魔女审判:
  
  时间: "早（发现尸体后不久）"
  
  场景名: "典狱长宣布魔女审判"
  地点: "会客厅"
  在场角色:
    - "全体囚犯（11人）"
    - "典狱长"
    - "看守"
  
  需要扩写的大纲: |
    听见骚动赶来的少女们看见诺亚的惨烈景象，不禁倒吸一口凉气，哭喊着，颤抖着，尖叫着，陷入了恐慌。
    
    就好像是挑准了时间一样，手机的提示音回荡在过道之中。
    
    『唉……收到一份报告。据说发生了一起令人痛心的凶杀案啊』
    『大家注意，请大家立即前往会客厅集合。不遵守者将被看守带走……』
    
    正如典狱长所说，看守已经抵达过道。
    艾玛的脑袋乱作一团，身体里好像有什么东西堵住似的，连呼吸都变得不太顺畅。
    但因为看守在场的关系，少女们只好动身前往指定地点。
    没有任何人说话。大家的脸上都没有任何表情。
    
    集合到会客厅的少女共有11位。每个人都略显尴尬地回避着其他人的视线。
    
    这时，随着天花板边上传来一阵翅膀拍动的声音，典狱长现身了。
    
    "唉……结果还是发生了凶杀案……"
    "今晚，将会举行【魔女审判】。"
    "请各位务必从在押囚犯当中锁定杀人凶手的身份。选中的人将以【魔女】的身份被处以死刑。"
    "我们会用特殊方法行刑，令不会轻易死亡的魔女永久地安息。那会是非常……非常残酷的方法。"
    "另外，有件事要向全体囚犯通告。如果没有选出凶手，将会对所有人处刑。"
    
    听到典狱长轻松说出十分可怕的宣言，少女们开始躁动起来。
    
    "虽然我很不想增加无谓的工作，不过各位本来就是以危险分子的身份囚禁在此……"
    "只是……主人说……不对，总之呢，以我们监牢管理方的感受而言，要是全员处死就太可怜了。"
    "所以呢，各位一定要选出一位【魔女】，只把【魔女】做掉就好了。"
    "说到底，只有在无法选定【魔女】的情况下才会触发全员处死的规定。"
    "请各位努力找到凶手哦……只要找到凶手，就能活下来……哎，总之，大家乐观一点享受当下的状况吧。"
    "啊，还有，为了避免搜查期间有人做手脚，请大家不要随意触碰遗体。现场也请保持原状不动。"
    "那么，就拜托大家进行搜查了。啊！不过搜查也挺难的，大家不要勉强自己哦……搞不懂的话，各位只要去死就好了……"
    "搜查期限到魔女审判开庭广播为止。只要我还没下班，视乎我的心情，也会回答各位的提问……或许吧。"
    
    典狱长结束了自说自话后便离开了。
    
    必须要在审判中选一个人去死。艾玛感到自己全身手脚冰凉。
    如果不能在今天之内选出一位凶手，就要全体处死……时间也太不够用了！
    而且，她不愿意相信她们之中竟有人行凶杀人！
    可是，诺亚确实是被人杀死的……太过分了……无法原谅……
    
    会客厅充斥着一股尴尬的沉默。
    像是在猜测他人的想法一样，每个人的视线都游离不定。
    少女们度过的共同生活仅仅数日。大家对彼此都不甚熟悉。
    要在这种情况下互相信任，真的是非常，非常困难。
  
  蕾雅的指控:
    需要扩写的大纲: |
      之后，蕾雅站在室内正中心。所有人的目光集中在她身上。
      
      "发生这样的事，我真的很难受……但，我想要找出凶手。"蕾雅说道。
      "我同意。我也不想蒙冤被判死刑。"玛格附和道。
      "这起凶杀案的凶手，应当以【魔女】的身份老实接受惩罚。"
      "嗯，我相信大家都是这个想法。没多少时间了，我们分头去搜查吧。"
      
      蕾雅和玛格二人正准备离开。艾玛慌张了起来。
      
      "等、等一下，蕾雅！只要知道谁是凶手，就要把她送上处刑台吗！？"
      
      蕾雅从艾玛身边走过。她的表情十分复杂。
      
      "这是为了帮助大家。而且我心里已经有了可疑人选。"
      
      艾玛惊得呆住了。此时蕾雅的眼神，指向了汉娜。
      
      "远野汉娜。——你就是杀害了城崎诺亚的凶手，对不对？"
      "什么……"汉娜震惊地说不出话。
      "虽然我还没仔细调查，但是现场没有留下足迹。"
      "也就是说……只有拥有飘浮魔法的人才有办法作案，我没说错吧？"
      
      "汉娜她不可能是凶手！"艾玛反驳道。
      "……你如果是这么想的话，就去搜查吧。我今晚会让一切水落石出。"
      
      蕾雅走出了会客厅。
      
      艾玛心想：为了帮助大家，必须要选某个人做魔女……所以蕾雅才会这么果断地指控汉娜……
      虽然能理解她的想法，可是，汉娜真的是凶手吗？
    
    被指控者: "远野汉娜"
    指控理由: "现场没有足迹，只有拥有飘浮魔法的人才能作案"
    指控者: "莲见蕾雅"
  
