id: prison_courtyard
disabled: true
name: 中庭
type: nature
summary: |
  魔女监狱 1F 建筑中心的庭院，有一座旧喷泉。
  这是少女们能呼吸到外部空气的少数地方之一。
  亚里沙在这里挂了她的吊床。
openHours:
  open: 6
  close: 22

atmosphere:
  morning: |
    喷泉的水声很轻。早晨的风吹过石板地。
    几只灰色的鸟停在喷泉边缘——它们是这里唯一自由的存在。
  afternoon: |
    阳光直射时，石板被晒得发烫。亚里沙的吊床在角落晃动。
  evening: |
    红色的夕阳让喷泉的水变成液态金属色。这是少女们最爱的时段——
    短暂的、可以伪装成"自由"的几分钟。
  night: |
    禁止外出。中庭的门会自动锁上。喷泉在月光下闪。
