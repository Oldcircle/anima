id: beach
name: 海边
type: nature

atmosphere:
  morning: |
    清晨的海面泛着金色的光，浪花轻轻拍打着沙滩。海风带着咸味和海藻的气息。
    沙滩上还能看到昨晚潮水留下的贝壳和海草。几只海鸥在低空盘旋。
  afternoon: |
    午后的海边阳光炽烈，沙子被晒得烫脚。海浪声有节奏地起伏。
    远处有几条渔船在海面上晃悠，船帆被风吹得鼓鼓的。
  evening: |
    夕阳把海面染成一片橘红色，天边的云像被火烧过一样。
    海风变凉了，带走了白天的暑气。沙滩上留着几串脚印，潮水正在慢慢抹去它们。
  night: |
    夜晚的海边只有浪声和风声。月光在海面上铺了一条银色的路。
    远处灯塔的光一明一灭，像一只眨眼的眼睛。沙滩在月光下发着微微的白光。
  rainy: |
    雨天的海边灰蒙蒙的，海面和天空连成一片，分不清哪里是水哪里是云。
    浪比平时大，拍在岩石上溅起白沫。雨点打在沙滩上留下密密麻麻的小坑。
