id: beach
name: 海边
type: nature
summary: 游泳、散步、捡贝壳、钓鱼

tools:
  - name: swim
    description: "下海游泳，消暑放松"
    effects: { fun: 25, energy: -10, hygiene: -15 }
    duration: 4
  - name: collect_shells
    description: "在沙滩上捡贝壳或小石头"
    effects: { fun: 5 }
    duration: 2
  - name: walk
    description: "沿着海边散步，吹吹海风"
    effects: { fun: 8, energy: -3 }
    duration: 2
  - name: stargaze
    description: "躺在沙滩上看星星"
    effects: { fun: 15, energy: -2 }
    duration: 4

atmosphere:
  morning: |
    清晨的海面泛着金色的光，浪花轻轻拍打着沙滩。海风带着咸味和海藻的气息。
    沙滩上还能看到昨晚潮水留下的贝壳和海草。几只海鸥在低空盘旋。
  afternoon: |
    午后的海边阳光炽烈，沙子被晒得烫脚。海浪声有节奏地起伏。
    远处有几条渔船在海面上晃悠，船帆被风吹得鼓鼓的。
  evening: |
    夕阳把海面染成一片橘红色，天边的云像被火烧过一样。
    海风变凉了，带走了白天的暑气。沙滩上留着几串脚印，潮水正在慢慢抹去它们。
  night: |
    夜晚的海边只有浪声和风声。月光在海面上铺了一条银色的路。
    远处灯塔的光一明一灭，像一只眨眼的眼睛。沙滩在月光下发着微微的白光。
  rainy: |
    雨天的海边灰蒙蒙的，海面和天空连成一片，分不清哪里是水哪里是云。
    浪比平时大，拍在岩石上溅起白沫。雨点打在沙滩上留下密密麻麻的小坑。

# 器物层（PLAN-grounding M0）
objects:
  - id: tide_line
    name: 潮线
    summary: 昨夜潮水留下的痕迹，贝壳和海草搁在一条线上
    keywords: [潮线, 贝壳, 海草]
    canon:
      - 每天潮线的位置都不一样，赶海的人看一眼就知道今天运气如何
  - id: old_boat
    name: 废旧小船
    summary: 半埋在沙里的废木船，漆皮剥落
    keywords: [小船, 木船, 船底]
    canon:
      - 船底破了个洞，倒扣着反而成了藏小东西的好地方
    tamperable: true
  - id: reef_rocks
    name: 礁石堆
    summary: 沙滩尽头的礁石堆，退潮时露出一汪汪水洼
    keywords: [礁石, 水洼]
    canon:
      - 水洼里困住的小鱼小蟹，是耐心人的零嘴
