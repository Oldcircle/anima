id: prison_courtroom
disabled: true
name: 魔女审判庭
type: special
summary: |
  魔女监狱建筑核心。挑高式巨大法院，圆形审判席，彩色玻璃窗。
  只有在凶杀案发生后、举行【魔女审判】时才会启用。
  典狱长会从天花板上的高处俯视。
openHours:
  open: 0
  close: 24

atmosphere:
  morning: |
    高耸的彩色玻璃窗将光线打成红绿蓝的斑块洒在地上。
    11 个审判台围成圆环。这里平时是空的——但只要响起广播，所有人都必须到场。
  afternoon: |
    沉重的死寂。
  evening: |
    审判的时间。彩色玻璃窗外光线渐渐变红，像是预示着什么。
  night: |
    完全的黑暗。除非有人即将死。
