id: prison_lounge
name: 监狱休息室
type: public
summary: |
  魔女监狱 1F 中央偏西。沙发和电视。
  少女们在自由时间最常聚集的地方，是信息交流的中心。
openHours:
  open: 6
  close: 22

atmosphere:
  morning: |
    沙发上还有昨夜的枕头痕迹。电视没开，墙上的圆形挂钟滴答作响。
    早起的人在这里翻昨晚的报纸。
  afternoon: |
    几个少女围坐沙发上闲聊。空气里飘着诺亚的颜料味——她又跑哪里画画去了。
    电视播着典狱长允许的"节目"——一段无聊的旧电影循环。
  evening: |
    最热闹的时段。少女们三五成群地讨论着白天看到的事。
    谁在哪里被看见、谁说了什么、谁的眼神不对——
    流言就是从这里诞生的。
  night: |
    无人。沙发上残留的折痕。窗外只有黑色。
