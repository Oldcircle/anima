id: farm
name: 农田
type: nature
summary: 干农活、采摘、散步

tools:
  - name: work
    description: "在农田干活：除草、浇水、翻地"
    effects: { energy: -20, hunger: -10 }
    duration: 8
    condition: "isWorkplace"
  - name: explore
    description: "在田间散步，看看庄稼长势"
    effects: { fun: 5, energy: -3 }
    duration: 2

atmosphere:
  morning: |
    清晨的农田上笼着薄薄的雾气，露水挂在菜叶上。
    泥土的气息很浓，偶尔能听到远处公鸡打鸣。田垄整整齐齐地延伸到远处。
  afternoon: |
    午后的农田被太阳晒得热烘烘的，庄稼的叶子有点蔫。
    蝉声震耳，空气里有干草和熟土的味道。远处的稻草人在风中歪歪斜斜地站着。
  evening: |
    傍晚的农田被夕阳照成金色，微风吹过庄稼地发出沙沙的声响。
    田间的小路上偶尔有人推着车回家，影子拉得很长。
  night: |
    夜晚的农田一片漆黑，只有虫鸣和远处村子的灯光。
    月亮照在田埂上，庄稼在夜风中轻轻摇摆。
  rainy: |
    雨天的农田变成了一片泥泞，田垄间积了水。庄稼被雨打得直不起腰。
    没人在田里干活，只有雨声和偶尔的蛙鸣。
