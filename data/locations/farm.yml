id: farm
name: 农田
type: nature
summary: 干农活、采摘、散步

tools:
  - name: explore
    description: "在田间散步，看看庄稼长势"
    effects: { fun: 5, energy: -3 }
    duration: 2

atmosphere:
  morning: |
    清晨的农田上笼着薄薄的雾气，露水挂在菜叶上。
    泥土的气息很浓，偶尔能听到远处公鸡打鸣。田垄整整齐齐地延伸到远处。
  afternoon: |
    午后的农田被太阳晒得热烘烘的，庄稼的叶子有点蔫。
    蝉声震耳，空气里有干草和熟土的味道。远处的稻草人在风中歪歪斜斜地站着。
  evening: |
    傍晚的农田被夕阳照成金色，微风吹过庄稼地发出沙沙的声响。
    田间的小路上偶尔有人推着车回家，影子拉得很长。
  night: |
    夜晚的农田一片漆黑，只有虫鸣和远处村子的灯光。
    月亮照在田埂上，庄稼在夜风中轻轻摇摆。
  rainy: |
    雨天的农田变成了一片泥泞，田垄间积了水。庄稼被雨打得直不起腰。
    没人在田里干活，只有雨声和偶尔的蛙鸣。

# 器物层（PLAN-grounding M0）
objects:
  - id: toolshed
    name: 农具棚
    summary: 田边的农具棚，锄头铁锹靠墙立着
    keywords: [农具, 锄头, 铁锹]
    canon:
      - 农具不上锁，借用要放回原位——这是田里的规矩
    tamperable: true
  - id: scarecrow
    name: 稻草人
    summary: 田中央的旧稻草人，戴一顶褪色的草帽
    keywords: [稻草人, 草帽]
    canon:
      - 草帽已经换过三顶，前两顶都是被台风卷走的
  - id: well
    name: 老水井
    summary: 田角的老水井，辘轳还能用
    keywords: [水井, 辘轳]
    canon:
      - 井绳每年换一次；井底据说掉过一把钥匙，一直没捞上来
