id: bakery
name: 海风面包坊
type: commercial
summary: 买面包、吃东西
openHours:
  open: 7
  close: 17

tools:
  - name: eat
    description: "在面包店吃东西（8金币）"
    effects: { hunger: 50, energy: 10, happiness: 5 }
    cost: 8
    duration: 2
  - name: work
    description: "在面包店工作：揉面、烤面包、招呼客人"
    effects: { energy: -15, hunger: -10 }
    duration: 8
    condition: "isWorkplace"

career_track:
  - level: 1
    title: "面包店学徒"
    income: 8
    required_skill: { baking: 0 }
  - level: 2
    title: "面包师"
    income: 15
    required_skill: { baking: 5 }
  - level: 3
    title: "主厨"
    income: 25
    required_skill: { baking: 8 }

atmosphere:
  morning: |
    烤箱里传来阵阵面包香，金黄色的可颂整齐地排在展示柜里。
    揉面的节奏声和轻哼的歌声混在一起。柜台上撒了一层薄薄的面粉。
  afternoon: |
    午后的面包店安静了些，早上出炉的面包卖得差不多了。
    阳光照在木质柜台上，空气里还残留着黄油和酵母的温暖气息。
  evening: |
    面包店快打烊了，展示柜几乎空了。后厨还在收拾，金属器具偶尔碰出声响。
    门口的小黑板上写着"明天见"。
  night: |
    面包店已经关门，铁栅门拉下来了。透过缝隙能看到里面黑漆漆的，只有冰箱指示灯闪着微光。
  rainy: |
    雨天的面包店格外温暖，玻璃窗被热气蒸出水雾。
    推门进去的瞬间，湿冷的空气和烤面包的香气撞在一起，让人不自觉地放松肩膀。
