id: bakery
name: 海风面包坊
type: commercial
summary: 买面包、吃东西
openHours:
  open: 7
  close: 17

shop:
  - { id: bread_plain, name: 白面包, price: 5 }
  - { id: bread_red_bean, name: 红豆面包, price: 8 }
  - { id: croissant, name: 可颂, price: 10 }

worker_tools:
  - name: knead_dough
    description: "揉面团"
    effects: { energy: -3, fun: -1 }
    duration: 2
    income: 2
  - name: bake
    description: "烤面包"
    effects: { energy: -2 }
    duration: 3
    income: 6
  - name: serve_customer
    description: "招呼客人、卖面包"
    effects: { energy: -2, social: 3 }
    duration: 1
    income: 8

tools: []

career_track:
  - level: 1
    title: "面包店学徒"
    income: 8
    required_skill: { baking: 0 }
  - level: 2
    title: "面包师"
    income: 15
    required_skill: { baking: 5 }
  - level: 3
    title: "主厨"
    income: 25
    required_skill: { baking: 8 }

atmosphere:
  morning: |
    烤箱里传来阵阵面包香，金黄色的可颂整齐地排在展示柜里。
    揉面的节奏声和轻哼的歌声混在一起。柜台上撒了一层薄薄的面粉。
  afternoon: |
    午后的面包店安静了些，早上出炉的面包卖得差不多了。
    阳光照在木质柜台上，空气里还残留着黄油和酵母的温暖气息。
  evening: |
    面包店快打烊了，展示柜几乎空了。后厨还在收拾，金属器具偶尔碰出声响。
    门口的小黑板上写着"明天见"。
  night: |
    面包店已经关门，铁栅门拉下来了。透过缝隙能看到里面黑漆漆的，只有冰箱指示灯闪着微光。
  rainy: |
    雨天的面包店格外温暖，玻璃窗被热气蒸出水雾。
    推门进去的瞬间，湿冷的空气和烤面包的香气撞在一起，让人不自觉地放松肩膀。

# 器物层（PLAN-grounding M0）
objects:
  - id: register
    name: 收银台
    summary: 柜台一角的收银台，抽屉里收着当日货款
    keywords: [收银, 钱盒, 货款, 抽屉]
    canon:
      - 抽屉合不严，得抬一下再推才关得上——熟手都知道
    tamperable: true
  - id: oven
    name: 老烤炉
    summary: 这家店的心脏，一台烧了很多年的老烤炉
    keywords: [烤炉, 烤箱]
    canon:
      - 炉膛第二层受热不匀，只用来烤脆皮——店里的老规矩
  - id: display
    name: 展示柜
    summary: 玻璃展示柜，可颂和面包按出炉批次摆
    keywords: [展示柜, 可颂, 玻璃柜]
    canon:
      - 玻璃上每天都会留下小孩的手印和鼻尖印
  - id: backdoor
    name: 后门
    summary: 通后巷的木后门，平时进货走这里
    keywords: [后门, 后巷]
    canon:
      - 门轴缺油，一推就吱呀响，夜里听得格外清楚
    tamperable: true
