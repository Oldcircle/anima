id: shop
name: 杂货店
type: commercial
openHours:
  open: 8
  close: 20

atmosphere:
  morning: |
    杂货店一大早就开门了。店主在柜台后面听收音机，收音机里放着早间新闻。
    货架上摆着各种日用品和零食，有些已经落了薄薄一层灰。门口挂着今日特价的手写牌子。
  afternoon: |
    午后的杂货店很安静，偶尔有人进来买瓶水或一包烟。
    风扇在头顶吱呀呀地转着，吹不走夏天的闷热。店主可能在打盹。
  evening: |
    傍晚杂货店忙了起来，下班的人顺路来买些东西。
    日光灯把小店照得通亮，收银台前排了两三个人。
  night: |
    杂货店已经拉下卷帘门了。门缝里透出一点灯光——店主可能还在里面算账。
  rainy: |
    雨天杂货店的生意反而好些，进来避雨顺便买东西的人不少。
    门口摆了个装伞的桶，地上被踩出一片水渍。
