id: shop
name: 杂货店
type: commercial
summary: 买日用品、逛逛
openHours:
  open: 8
  close: 20

shop:
  - { id: notebook, name: 笔记本, price: 10 }
  - { id: fishing_rod, name: 鱼竿, price: 25 }
  - { id: art_supplies, name: 画具, price: 15 }
  - { id: umbrella, name: 雨伞, price: 10 }
  - { id: ingredients, name: 食材, price: 5 }
  - { id: bento, name: 便当, price: 10 }
  - { id: onigiri, name: 饭团, price: 5 }
  - { id: water_bottle, name: 矿泉水, price: 3 }
  - { id: fruit_candy, name: 水果糖, price: 3 }
  - { id: medicine, name: 感冒药, price: 12 }
  - { id: vegetable_seeds, name: 蔬菜种子, price: 4 }
  - { id: guitar, name: 吉他, price: 80 }
  - { id: camera, name: 相机, price: 50 }

tools:
  - name: buy_supplies
    description: "买些日用品（5金币）"
    effects: { hygiene: 10, fun: 3 }
    cost: 5
    duration: 1

atmosphere:
  morning: |
    杂货店一大早就开门了。店主在柜台后面听收音机，收音机里放着早间新闻。
    货架上摆着各种日用品和零食，有些已经落了薄薄一层灰。门口挂着今日特价的手写牌子。
  afternoon: |
    午后的杂货店很安静，偶尔有人进来买瓶水或一包烟。
    风扇在头顶吱呀呀地转着，吹不走夏天的闷热。店主可能在打盹。
  evening: |
    傍晚杂货店忙了起来，下班的人顺路来买些东西。
    日光灯把小店照得通亮，收银台前排了两三个人。
  night: |
    杂货店已经拉下卷帘门了。门缝里透出一点灯光——店主可能还在里面算账。
  rainy: |
    雨天杂货店的生意反而好些，进来避雨顺便买东西的人不少。
    门口摆了个装伞的桶，地上被踩出一片水渍。

# 器物层（PLAN-grounding M0）
objects:
  - id: till
    name: 柜台钱盒
    summary: 柜台后的铁皮钱盒，白天收的货款都搁在里面，晚上才上锁
    keywords: [钱盒, 铁盒, 货款, 柜台]
    canon:
      - 锁扣去年换过一次新的，旧的那个用螺丝刀就能别开
      - 店主记账全靠盒底压着的一沓单据
    tamperable: true
  - id: shelves
    name: 货架
    summary: 顶到房梁的木货架，日用品和零食分层摆放
    keywords: [货架, 日用品, 存货]
    canon:
      - 最上层的存货落着灰，店主自己都记不清放了什么
  - id: radio
    name: 老收音机
    summary: 柜台后那台老收音机，店主一开门就拧开
    keywords: [收音机]
    canon:
      - 旋钮松了，只收得到早间新闻和一个戏曲台
  - id: price_board
    name: 特价牌
    summary: 门口的手写特价牌，粉笔字
    keywords: [特价, 牌子]
    canon:
      - 笔迹是店主的，写错了就用袖口一抹
    tamperable: true
