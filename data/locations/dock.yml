id: dock
name: 码头
type: nature
summary: 钓鱼、看海、看渔船

tools:
  - name: fish
    description: "在码头钓鱼"
    effects: { fun: 10, energy: -5 }
    duration: 8
  - name: explore
    description: "在码头逛逛，看看渔船和渔民"
    effects: { fun: 5, energy: -2 }
    duration: 2

atmosphere:
  morning: |
    清晨的码头很忙碌，渔民们在检查渔网和船只。柴油机的突突声和海鸥的叫声混在一起。
    空气里有鱼腥味、柴油味和海水的咸味。木栈桥被露水打湿，走上去有点滑。
  afternoon: |
    午后码头安静下来，渔船都出海了。几条绳子系在木桩上随波晃荡。
    阳光晒得木板发烫，坐在栈桥边能看到水下的海草和小鱼。
  evening: |
    傍晚的码头陆续有渔船回来，船上装着今天的收获。
    夕阳把海面和码头都染成金色，渔民们互相招呼着卸货。海风里多了晚饭的烟火气。
  night: |
    夜晚的码头只有海浪拍打木桩的声音。停泊的渔船随着海浪轻轻起伏。
    远处灯塔的光在黑暗的海面上扫过，间歇性地照亮码头的一角。
  rainy: |
    雨天的码头没什么人，渔船都拴在桩上不出海。雨点打在海面上，
    溅起密密麻麻的小水花。木栈桥湿滑得很，走路要小心。缆绳在风中吱嘎作响。
