id: cafe
name: 咖啡馆
type: commercial
summary: 喝咖啡、吃东西、放松
openHours:
  open: 7
  close: 22

tools:
  - name: eat
    description: "在咖啡馆吃点东西（15金币）"
    effects: { hunger: 50, energy: 10, happiness: 5 }
    cost: 15
    duration: 2
  - name: drink
    description: "点一杯咖啡或饮料（8金币）"
    effects: { energy: 5, happiness: 8, social: 3 }
    cost: 8
    duration: 2
  - name: work
    description: "在咖啡馆工作：冲咖啡、招呼客人、清理桌子"
    effects: { energy: -15, hunger: -10 }
    duration: 8
    condition: "isWorkplace"

atmosphere:
  morning: |
    晨光从落地窗斜照进来，吧台后面的咖啡机发出低沉的嗡嗡声。
    空气中弥漫着现磨咖啡豆和黄油可颂的香气。只有零星几个客人，安静得能听到杯碟轻碰。
  afternoon: |
    午后的阳光被半拉的竹帘切成条纹，投在木质地板上。
    角落的音响放着低音量的爵士乐。客人多了起来，交谈声混在一起变成柔和的背景音。
  evening: |
    暖黄色的壁灯亮起来，窗外能看到港口的灯火倒映在海面上。
    吧台上摆着今日甜品的小黑板，粉笔字有点歪歪扭扭的。空气里多了一丝奶油的甜味。
  night: |
    打烊前的咖啡馆只剩几盏小灯亮着，吧台擦得发亮。
    街上很安静，偶尔有醉汉路过的笑声传进来。
  rainy: |
    雨打在遮阳棚上，发出密集的沙沙声。玻璃门上蒙了一层雾气，
    偶尔有人推门进来，带进一股潮湿的风和泥土的味道。店里比平时暖和。
