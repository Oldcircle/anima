id: cafe
name: 咖啡馆
type: commercial
summary: 喝咖啡、吃东西、放松
openHours:
  open: 7
  close: 22

shop:
  - { id: coffee_latte, name: 拿铁, price: 8 }
  - { id: coffee_americano, name: 美式咖啡, price: 6 }
  - { id: sandwich, name: 三明治, price: 12 }
  - { id: cake_slice, name: 蛋糕, price: 15 }
  - { id: juice, name: 果汁, price: 6 }
  - { id: sugar_cube, name: 方糖, price: 2 }

worker_tools:
  - name: make_coffee
    description: "做咖啡"
    effects: { energy: -2, fun: 1 }
    duration: 1
    income: 6
  - name: serve_customer
    description: "送餐、收碟子"
    effects: { energy: -3, social: 2 }
    duration: 1
    income: 8
  - name: clean_table
    description: "擦桌子"
    effects: { energy: -2, fun: -3, hygiene: -2 }
    duration: 1
    income: 2

tools:
  - name: use_toilet
    description: "上厕所"
    effects: { bladder: 100 }
    duration: 1
    condition: "bladder < 70"

career_track:
  - level: 1
    title: "咖啡馆店员"
    income: 10
    required_skill: { barista: 0 }
  - level: 2
    title: "咖啡师"
    income: 18
    required_skill: { barista: 4 }
  - level: 3
    title: "店长"
    income: 28
    required_skill: { barista: 7, social: 5 }

atmosphere:
  morning: |
    晨光从落地窗斜照进来，吧台后面的咖啡机发出低沉的嗡嗡声。
    空气中弥漫着现磨咖啡豆和黄油可颂的香气。只有零星几个客人，安静得能听到杯碟轻碰。
  afternoon: |
    午后的阳光被半拉的竹帘切成条纹，投在木质地板上。
    角落的音响放着低音量的爵士乐。客人多了起来，交谈声混在一起变成柔和的背景音。
  evening: |
    暖黄色的壁灯亮起来，窗外能看到港口的灯火倒映在海面上。
    吧台上摆着今日甜品的小黑板，粉笔字有点歪歪扭扭的。空气里多了一丝奶油的甜味。
  night: |
    咖啡馆已经打烊了，灯都关了，只剩吧台上方一盏小夜灯。
    门锁着，街上一片寂静。已经很晚了，该回家休息了。
  rainy: |
    雨打在遮阳棚上，发出密集的沙沙声。玻璃门上蒙了一层雾气，
    偶尔有人推门进来，带进一股潮湿的风和泥土的味道。店里比平时暖和。

# 器物层（PLAN-grounding M0）
objects:
  - id: machine
    name: 咖啡机
    summary: 吧台后的咖啡机，嗡嗡声是店里的底噪
    keywords: [咖啡机]
    canon:
      - 蒸汽阀有个小脾气，拧到一半要停半拍再拧到底——只有店里人知道
  - id: window_seat
    name: 靠窗座
    summary: 落地窗边最抢手的位子，阳光最好
    keywords: [靠窗, 位子, 座位]
    canon:
      - 桌面下粘着不知哪年谁按上去的口香糖，硬得像化石
  - id: register
    name: 收银台
    summary: 吧台一端的收银台，找零盘就摆在旁边
    keywords: [收银, 钱盒, 找零]
    canon:
      - 找零盘里常年混着一枚谁也不肯收的外国硬币
    tamperable: true
  - id: menu_board
    name: 菜单黑板
    summary: 手写粉笔菜单，今日特调写在最上面
    keywords: [黑板, 菜单, 特调]
    canon:
      - 右下角有一块谁都不许擦的旧字迹，是开店那天写的
    tamperable: true
