id: bar
name: 酒吧
type: commercial
summary: 喝酒、放松、听音乐
openHours:
  open: 17
  close: 2

shop:
  - { id: beer, name: 啤酒, price: 10 }
  - { id: juice, name: 果汁, price: 6 }

tools:
  - name: use_toilet
    description: "上厕所"
    effects: { bladder: 100 }
    duration: 1
    condition: "bladder < 70"

atmosphere:
  morning: |
    酒吧还没开门，卷帘门紧闭。门口的招牌灯没亮，地上散着几个昨晚的烟头。
  afternoon: |
    酒吧下午还是关着的，但能透过窗户看到里面有人在擦桌子摆杯子，准备晚上营业。
  evening: |
    酒吧刚开门，暖色的灯光从窗户里透出来。吧台后面的酒瓶在灯光下一排排发着光。
    音乐声不大，几个常客已经坐在老位置上了。空气里有啤酒花和木头的味道。
  night: |
    深夜的酒吧是小镇最热闹的地方。人声、笑声和音乐混在一起。
    吧台前坐满了人，酒保忙得团团转。空气里全是酒精和烟草的味道，灯光暗得刚好。
  rainy: |
    雨夜的酒吧人特别多，都是不想淋雨回家的人。窗户上全是水雾，
    里面的灯光模模糊糊地透出来。推门进去，一股温暖的酒气扑面而来。

# 器物层（PLAN-grounding M0）
objects:
  - id: counter
    name: 吧台
    summary: 擦得发亮的木吧台，酒渍浸出深色的年轮
    keywords: [吧台]
    canon:
      - 台面靠里一侧有一道刀刻的正字，没人说得清在数什么
  - id: bottle_shelf
    name: 酒架
    summary: 背墙的酒架，瓶子按度数从低到高排
    keywords: [酒架, 酒瓶]
    canon:
      - 最高层有一瓶从来不卖的酒，老板说那是压店的
  - id: register
    name: 收银台
    summary: 吧台角落的收银台，夜里生意好的时候最乱
    keywords: [收银, 钱盒]
    canon:
      - 夜里收的钱总比账面乱得多，老板懒得细对
    tamperable: true
