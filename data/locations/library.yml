id: library
name: 图书馆
type: public
summary: 看书、学习、安静休息
openHours:
  open: 9
  close: 18

tools:
  - name: read
    description: "找一本书安静地看"
    effects: { happiness: 10, energy: -3 }
    duration: 4
  - name: work
    description: "在图书馆工作：整理书架、办理借阅"
    effects: { energy: -15, hunger: -10 }
    duration: 8
    condition: "isWorkplace"

atmosphere:
  morning: |
    图书馆刚开门，空气里有书页和木家具的味道。阳光透过高窗照进来，
    照亮了空气中飘浮的细小灰尘。很安静，只有管理员整理书架的轻微声响。
  afternoon: |
    午后的图书馆有几个人在看书，翻页声和偶尔的咳嗽声是唯一的声音。
    角落的阅读灯亮着柔和的光。窗外的树影投在书架上，随风轻轻摇晃。
  evening: |
    快闭馆了，图书馆里只剩一两个人还在看书。管理员开始收拾前台，
    暗示该走了。夕阳从西窗射进来，把整排书脊染成暖色。
  night: |
    图书馆已经关了，窗户里黑漆漆的。门口的公告板上贴着闭馆通知和几张旧海报。
  rainy: |
    下雨天来图书馆的人多了些，大家都想找个安静干燥的地方待着。
    雨声透过窗户隐隐约约传进来，反而让屋里显得更安静。空气比平时潮湿一点。
