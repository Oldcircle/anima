id: flower_shop
name: 潮声花店
type: commercial
summary: 买花、赏花、工作
openHours:
  open: 8
  close: 18

shop:
  - { id: flower_bouquet, name: 花束, price: 15 }
  - { id: flower_single, name: 一朵花, price: 5 }
  - { id: flower_materials, name: 花材, price: 8 }

worker_tools:
  - name: arrange_flowers
    description: "整理花束、换水"
    effects: { energy: -2, fun: 2 }
    duration: 1
    income: 5
  - name: serve_customer
    description: "招呼客人"
    effects: { energy: -2, social: 3 }
    duration: 1
    income: 8

tools: []

career_track:
  - level: 1
    title: "花店店员"
    income: 12
    required_skill: { botany: 0 }
  - level: 2
    title: "花店店主"
    income: 18
    required_skill: { botany: 4 }
  - level: 3
    title: "花艺师"
    income: 30
    required_skill: { botany: 7 }

atmosphere:
  morning: |
    花店刚开门，门口的盆栽已经浇好了水。空气里混着泥土和花瓣的清香。
    阳光照进来，照亮了一排排颜色各异的鲜花，水珠在花瓣上闪闪发光。
  afternoon: |
    午后花店里有些闷热，侧门打开着通风。花香变得更浓郁了，
    蜜蜂偶尔飞进来又飞出去。靠墙的架子上摆着几束包好的花等人来取。
  evening: |
    花店快要关门了，今天没卖完的花正在被整理归置。有些花瓣已经开始微微卷边。
    夕阳把整个花店染成暖橙色，像一幅油画。
  night: |
    花店已经关了，但透过玻璃窗能看到里面的花在月光下安静地待着。
    空气中还飘着淡淡的花香。
  rainy: |
    雨天的花店特别安静，门口的花被搬进屋里，挤挤挨挨地摆了一地。
    雨水顺着屋檐滴下来，和花店里轻柔的音乐混在一起。泥土的潮湿味和花香交织。

# 器物层（PLAN-grounding M0）
objects:
  - id: workbench
    name: 花艺台
    summary: 剪枝包花的木工作台，留着剪刀和麻绳的痕迹
    keywords: [花艺, 工作台, 剪刀]
    canon:
      - 台面左角的水渍圈是常年放水壶的位置
  - id: order_book
    name: 订花簿
    summary: 记订花的小本子——谁订了花、送给谁，都写在上面
    keywords: [订花, 本子, 订单]
    canon:
      - 有些订花人指名不留名字——本子上就画一个圈代替
    tamperable: true
  - id: pots
    name: 门口盆栽
    summary: 门口一排盆栽，每天开门前浇好水
    keywords: [盆栽, 花盆]
    canon:
      - 最旧那只陶盆缺了个口，是店开张那年就在的
  - id: cashbox
    name: 收银匣
    summary: 柜台下的小木匣，卖花的零钱和订金都收在里面
    keywords: [收银, 钱盒, 钱匣, 订金]
    canon:
      - 木匣没锁，全凭人不欺花
    tamperable: true
