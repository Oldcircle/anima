id: flower_shop
name: 潮声花店
type: commercial
summary: 买花、赏花、工作
openHours:
  open: 8
  close: 18

tools:
  - name: buy_flowers
    description: "买一束花（10金币）"
    effects: { happiness: 10 }
    cost: 10
    duration: 1
  - name: work
    description: "在花店工作：整理花束、浇水、招呼客人"
    effects: { energy: -15, hunger: -10 }
    duration: 8
    condition: "isWorkplace"

career_track:
  - level: 1
    title: "花店店员"
    income: 12
    required_skill: { botany: 0 }
  - level: 2
    title: "花店店主"
    income: 18
    required_skill: { botany: 4 }
  - level: 3
    title: "花艺师"
    income: 30
    required_skill: { botany: 7 }

atmosphere:
  morning: |
    花店刚开门，门口的盆栽已经浇好了水。空气里混着泥土和花瓣的清香。
    阳光照进来，照亮了一排排颜色各异的鲜花，水珠在花瓣上闪闪发光。
  afternoon: |
    午后花店里有些闷热，侧门打开着通风。花香变得更浓郁了，
    蜜蜂偶尔飞进来又飞出去。靠墙的架子上摆着几束包好的花等人来取。
  evening: |
    花店快要关门了，今天没卖完的花正在被整理归置。有些花瓣已经开始微微卷边。
    夕阳把整个花店染成暖橙色，像一幅油画。
  night: |
    花店已经关了，但透过玻璃窗能看到里面的花在月光下安静地待着。
    空气中还飘着淡淡的花香。
  rainy: |
    雨天的花店特别安静，门口的花被搬进屋里，挤挤挨挨地摆了一地。
    雨水顺着屋檐滴下来，和花店里轻柔的音乐混在一起。泥土的潮湿味和花香交织。
