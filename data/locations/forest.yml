id: forest
name: 森林
type: nature
summary: 散步、采集、安静独处

tools:
  - name: explore
    description: "在森林里探索，看看有什么发现"
    effects: { fun: 8, energy: -5 }
    duration: 4
  - name: collect_herbs
    description: "采集野花或草药"
    effects: { fun: 5 }
    duration: 2

atmosphere:
  morning: |
    清晨的森林被薄雾笼罩，阳光穿过树冠洒下一道道光柱。
    露水挂在蜘蛛网上亮晶晶的。鸟叫声从四面八方传来，空气清冽得像泉水。
  afternoon: |
    午后的森林里光影斑驳，树叶被风吹得沙沙响。
    地上铺着厚厚一层落叶，踩上去软软的。偶尔有松鼠从这棵树跳到那棵树上。
  evening: |
    傍晚的森林开始变暗了，树影拉得很长。鸟叫声渐渐被虫鸣替代。
    空气变凉了，带着树脂和腐叶的味道。
  night: |
    夜晚的森林很黑，月光只能照到最高的树冠。虫鸣声此起彼伏。
    偶尔有不知名的动物在灌木丛里窸窣作响。
  rainy: |
    雨天的森林像被水浸透了，每片叶子都在滴水。
    树干变成深褐色，苔藓绿得发亮。脚下的泥很滑，空气里全是泥土和绿叶的味道。

# 器物层（PLAN-grounding M0）
objects:
  - id: old_stump
    name: 老树桩
    summary: 林间空地的大树桩，年轮数得清
    keywords: [树桩, 年轮]
    canon:
      - 树桩中心有个浅洞，偶尔有人往里放小东西——像个不成文的信箱
    tamperable: true
  - id: trail_fork
    name: 小径岔口
    summary: 两条小径的岔口，一条往深林、一条绕回镇上
    keywords: [小径, 岔口, 深林]
    canon:
      - 往深林那条走的人少，落叶积得厚——有没有人走过，一眼就能看出来
  - id: spring
    name: 山泉眼
    summary: 石缝里渗出的山泉，接一捧冰得牙酸
    keywords: [山泉, 泉水]
    canon:
      - 泉眼边那块石头被踩得溜光——来接水的人都踩同一块
