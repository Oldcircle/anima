id: plaza
name: 广场
type: public
summary: 散步、晒太阳、看热闹

tools:
  - name: walk
    description: "在广场散步，看看周围的人和风景"
    effects: { fun: 5, energy: -2 }
    duration: 2
  - name: sit
    description: "在长椅上坐一会儿，晒晒太阳"
    effects: { energy: 3, fun: 5 }
    duration: 2
  - name: rest
    description: "在长椅上坐着歇会儿"
    effects: { energy: 5, fun: -2 }
    duration: 1

atmosphere:
  morning: |
    清晨的广场空旷安静，石板上还带着夜里的凉意。几只海鸥停在喷泉边上梳理羽毛。
    远处能听到面包店开门的声音和零星的脚步。
  afternoon: |
    广场上人来人往，几个老人坐在长椅上晒太阳。孩子们在喷泉边跑来跑去。
    卖冰淇淋的小推车停在树荫下，老板在打盹。
  evening: |
    傍晚的广场被路灯和周围店铺的灯光照亮。散步的人多了起来，
    有人牵着狗，有人三三两两聊天。喷泉的水声在安静的空气里显得格外清晰。
  night: |
    深夜的广场几乎没有人，路灯在石板上投下长长的影子。
    偶尔有人匆匆穿过，脚步声在空旷的广场上回响。
  rainy: |
    雨中的广场空荡荡的，石板被雨水冲得发亮。喷泉的水花和雨滴混在一起，
    分不清哪个是哪个。长椅上积了一层水，没有人坐。

# 器物层（PLAN-grounding M0）
objects:
  - id: fountain
    name: 石喷泉
    summary: 广场中央的石喷泉，海鸥爱停在沿上
    keywords: [喷泉]
    canon:
      - 池底沉着不少许愿的硬币，捞不捞得看良心
    tamperable: true
  - id: notice_board
    name: 公告板
    summary: 镇公告板，集会、寻物、卖船的启事都贴这里
    keywords: [公告板, 启事, 告示, 寻物]
    canon:
      - 图钉永远不够用，新启事总压着旧启事的角
    tamperable: true
  - id: bench
    name: 长椅
    summary: 喷泉边的两条旧长椅，木条被坐得发白
    keywords: [长椅]
    canon:
      - 其中一条的第三根木条松了，坐下去另一头会翘起来
