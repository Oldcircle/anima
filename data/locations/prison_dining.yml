id: prison_dining
disabled: true
name: 监狱食堂
type: public
summary: |
  魔女监狱 1F 东北侧。长桌和壁炉，连接厨房。
  全员每天必须在自由时间内到这里吃饭——这是所有少女几乎唯一的集体场所。
openHours:
  open: 6
  close: 22

atmosphere:
  morning: |
    长桌上摆好了简单的早餐：黑面包、煮蛋、温牛奶。
    壁炉里烧着木柴，但取不暖。看守站在门口数着人头。
  afternoon: |
    午餐是炖菜和面包。少女们在长桌两端按各自的派系坐着——
    几乎没有交叉。蕾雅那边吵闹，希罗那边沉默。
  evening: |
    晚餐有热汤。这是一天里少女们最容易开口说话的时段。
    壁炉的火光让墙上的人影变长。
  night: |
    无人。长桌上空空如也，只有壁炉余烬还在闪。
    禁止在此停留。
