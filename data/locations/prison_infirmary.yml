id: prison_infirmary
name: 监狱医务室
type: public
summary: |
  魔女监狱 1F 西北侧。病床和基本医疗设备。
  身体不适的少女可以在这里休息（需看护陪同）。
  夏目安安经常待在这里画画——这里没人打扰她。
openHours:
  open: 6
  close: 22

atmosphere:
  morning: |
    白色的窗帘半掩。空气里有消毒水和淡淡的草药味。
    安安坐在窗边的病床上，膝盖上放着她的素描本。
  afternoon: |
    阳光透过窗帘，在床单上投下斑驳的影子。
    抽屉里的药品分类整齐——梅露露经常来整理。
  evening: |
    昏黄的灯泡。安安的素描本上多了一页——她今天画了诺亚和蝴蝶。
  night: |
    禁止滞留。但有时会有人偷偷过来取镇定剂。
