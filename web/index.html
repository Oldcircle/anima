<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anima — AI 生命模拟</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; height: 100vh; overflow: hidden; font-size: 13px; }

    #app { display: grid; grid-template-rows: 44px 1fr; grid-template-columns: 220px 1fr 360px; height: 100vh; }

    /* ── 顶栏 ── */
    .topbar { grid-column: 1 / -1; background: #161b22; display: flex; align-items: center; padding: 0 16px; gap: 12px; border-bottom: 1px solid #30363d; }
    .topbar .time { font-size: 15px; font-weight: 600; color: #58a6ff; font-variant-numeric: tabular-nums; }
    .topbar .weather { font-size: 12px; color: #8b949e; }
    .topbar .speed { display: flex; gap: 2px; }
    .topbar .speed button { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .topbar .speed button:hover { border-color: #58a6ff; color: #c9d1d9; }
    .topbar .speed button.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
    .topbar .conn { margin-left: auto; font-size: 11px; color: #484f58; }

    /* ── 左侧角色列表 ── */
    .sidebar { background: #0d1117; border-right: 1px solid #21262d; overflow-y: auto; padding: 8px; }
    .char-card { background: #161b22; border: 1px solid #21262d; border-radius: 6px; padding: 8px; margin-bottom: 6px; cursor: pointer; transition: border-color .15s; }
    .char-card:hover { border-color: #30363d; }
    .char-card.selected { border-color: #58a6ff; background: #0d1117; }
    .char-card .cc-name { font-weight: 600; font-size: 13px; color: #f0f6fc; }
    .char-card .cc-meta { font-size: 11px; color: #484f58; margin-top: 2px; }
    .char-card .cc-loc { color: #8b949e; }
    .mini-bars { display: flex; gap: 2px; margin-top: 4px; }
    .mini-bar { flex: 1; height: 3px; background: #21262d; border-radius: 2px; overflow: hidden; }
    .mini-bar .fill { height: 100%; border-radius: 2px; }

    /* ── 中间时间线 ── */
    .timeline { overflow-y: auto; padding: 12px 16px; background: #0d1117; }
    .tick-group { margin-bottom: 16px; }
    .tick-header { font-size: 11px; color: #484f58; font-weight: 600; padding: 4px 0; border-bottom: 1px solid #161b22; margin-bottom: 6px; position: sticky; top: 0; background: #0d1117; z-index: 1; }
    .tick-entry { padding: 4px 0 4px 12px; border-left: 2px solid #21262d; margin-bottom: 4px; }
    .tick-entry.is-talk { border-left-color: #3fb950; }
    .tick-entry.is-skip { border-left-color: transparent; opacity: 0.4; }
    .tick-entry.is-fail { border-left-color: #f85149; }
    .tick-entry.is-random { border-left-color: #d29922; }
    .tick-entry.is-reflect { border-left-color: #a371f7; }
    .te-actor { font-weight: 600; color: #58a6ff; font-size: 12px; }
    .te-action { color: #8b949e; font-size: 12px; }
    .te-thought { color: #484f58; font-size: 11px; font-style: italic; margin-top: 2px; white-space: pre-wrap; }
    .te-dialogue { margin-top: 3px; padding: 4px 8px; background: #161b22; border-radius: 4px; border-left: 2px solid #3fb950; }
    .te-manner { color: #8b949e; font-size: 11px; }
    .te-message { color: #c9d1d9; font-size: 12px; margin-top: 1px; }
    .te-message::before { content: '「'; color: #3fb950; }
    .te-message::after { content: '」'; color: #3fb950; }
    .te-target { color: #d2a8ff; }

    /* ── 右侧面板 ── */
    .detail { background: #161b22; border-left: 1px solid #21262d; overflow-y: auto; display: flex; flex-direction: column; }
    .detail-tabs { display: flex; border-bottom: 1px solid #21262d; background: #0d1117; flex-shrink: 0; }
    .detail-tabs button { flex: 1; background: transparent; border: none; color: #484f58; padding: 8px 4px; font-size: 11px; cursor: pointer; border-bottom: 2px solid transparent; }
    .detail-tabs button:hover { color: #c9d1d9; }
    .detail-tabs button.active { color: #58a6ff; border-bottom-color: #58a6ff; }
    .detail-body { flex: 1; overflow-y: auto; padding: 12px; }

    .d-section { margin-bottom: 14px; }
    .d-section-title { font-size: 11px; color: #484f58; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }

    /* 角色档案 */
    .profile-header { text-align: center; padding: 12px 0; }
    .profile-header .p-name { font-size: 18px; font-weight: 700; color: #f0f6fc; }
    .profile-header .p-meta { font-size: 12px; color: #8b949e; margin-top: 2px; }
    .profile-text { font-size: 12px; color: #8b949e; line-height: 1.6; white-space: pre-wrap; }

    .need-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    .need-row .n-label { width: 32px; font-size: 11px; color: #8b949e; }
    .need-row .n-bar { flex: 1; height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; }
    .need-row .n-fill { height: 100%; border-radius: 3px; transition: width .4s; }
    .need-row .n-val { width: 24px; text-align: right; font-size: 10px; color: #484f58; }

    .rel-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 12px; cursor: pointer; }
    .rel-row:hover { color: #f0f6fc; }
    .rel-row .r-name { flex: 1; }
    .rel-row .r-type { color: #8b949e; font-size: 11px; }
    .rel-row .r-bar { width: 48px; height: 4px; background: #21262d; border-radius: 2px; overflow: hidden; }
    .rel-row .r-fill { height: 100%; border-radius: 2px; }

    /* 印象卡 */
    .imp-card { background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
    .imp-card .imp-target { font-weight: 600; color: #d2a8ff; font-size: 12px; }
    .imp-card .imp-label { display: inline-block; background: #1f6feb22; color: #58a6ff; padding: 1px 6px; border-radius: 8px; font-size: 10px; margin-left: 6px; }
    .imp-card .imp-summary { color: #c9d1d9; font-size: 12px; margin-top: 4px; }
    .imp-card .imp-obs { color: #8b949e; font-size: 11px; margin-top: 3px; }
    .imp-card .imp-q { color: #d29922; font-size: 11px; margin-top: 3px; font-style: italic; }

    /* 记忆 */
    .mem-item { padding: 4px 0; border-bottom: 1px solid #161b22; font-size: 11px; }
    .mem-item .m-type { display: inline-block; width: 14px; text-align: center; }
    .mem-item .m-content { color: #8b949e; }
    .mem-item .m-imp { color: #484f58; font-size: 10px; float: right; }

    .no-data { color: #30363d; text-align: center; padding: 20px; font-size: 12px; }

    /* 全局面板（无选中时） */
    .global-overview { padding: 12px; }
    .go-title { font-size: 11px; color: #484f58; font-weight: 600; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
    .go-char { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; cursor: pointer; border-bottom: 1px solid #21262d; }
    .go-char:hover { color: #f0f6fc; }

    /* Moodlet 标签 */
    .moodlet-tag { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 10px; margin: 1px 2px; }
    .moodlet-happy { background: #3fb95022; color: #3fb950; }
    .moodlet-sad { background: #58a6ff22; color: #58a6ff; }
    .moodlet-angry { background: #f8514922; color: #f85149; }
    .moodlet-embarrassed { background: #d2a8ff22; color: #d2a8ff; }
    .moodlet-anxious { background: #d2992222; color: #d29922; }
    .moodlet-confident { background: #3fb95022; color: #56d364; }
    .moodlet-lonely { background: #58a6ff22; color: #79c0ff; }
    .moodlet-grateful { background: #a371f722; color: #a371f7; }

    /* Bond 标签 */
    .bond-tag { display: inline-block; padding: 1px 5px; border-radius: 4px; font-size: 9px; background: #a371f722; color: #a371f7; margin-left: 4px; }

    /* 技能条 */
    .skill-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .skill-row .sk-name { width: 50px; font-size: 11px; color: #8b949e; }
    .skill-row .sk-bar { flex: 1; height: 4px; background: #21262d; border-radius: 2px; overflow: hidden; }
    .skill-row .sk-fill { height: 100%; border-radius: 2px; background: #58a6ff; }
    .skill-row .sk-val { width: 28px; text-align: right; font-size: 10px; color: #484f58; }

    /* Life 信息 */
    .life-info { font-size: 12px; color: #8b949e; line-height: 1.8; }
    .life-info .li-label { color: #484f58; }
    .life-info .li-aspiration { color: #d29922; font-style: italic; }
    .life-info .li-goal { color: #3fb950; }
    .life-info .li-concern { color: #f85149; }
  </style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="time" id="game-time">-- : --</div>
      <span class="weather" id="weather"></span>
      <div class="speed">
        <button onclick="setSpeed(0)">&#9208;</button>
        <button onclick="setSpeed(0.5)">&frac12;</button>
        <button class="active" onclick="setSpeed(1)">1x</button>
        <button onclick="setSpeed(2)">2x</button>
        <button onclick="setSpeed(5)">5x</button>
      </div>
      <div class="conn" id="conn">...</div>
    </div>

    <div class="sidebar" id="sidebar"></div>
    <div class="timeline" id="timeline"><div class="no-data">等待连接...</div></div>
    <div class="detail" id="detail"></div>
  </div>

  <script>
    // ── State ──
    let S = { characters: [], locations: [], weather: 'sunny', formattedTime: '', tick: 0, nameMap: {} };
    let relationships = [];
    let selectedId = null;
    let detailTab = 'profile';
    let tickLog = [];       // [{time, events, randomEvents, gossips, reflections}]
    let charDetail = null;   // 来自 get_character 的详细数据
    let charCards = null;    // 来自 /api/cards 的角色卡
    let ws = null;

    const WEATHER = { sunny: '&#9728;&#65039; 晴', cloudy: '&#9729;&#65039; 多云', rainy: '&#127783;&#65039; 雨', stormy: '&#9928;&#65039; 暴风雨', snowy: '&#10052;&#65039; 雪' };
    const NEED_LABEL = { hunger: '饱食', energy: '精力', social: '社交', happiness: '快乐', hygiene: '卫生' };
    const MEM_ICON = { event: '&#9733;', conversation: '&#128172;', thought: '&#128173;', observation: '&#128065;' };
    const needColor = v => v > 60 ? '#3fb950' : v > 30 ? '#d29922' : '#f85149';
    const relColor = v => v > 50 ? '#3fb950' : v > 20 ? '#58a6ff' : v > 0 ? '#8b949e' : '#f85149';
    const N = id => S.nameMap[id] || id;

    // ── WebSocket ──
    function connect() {
      ws = new WebSocket(`ws://${location.host}`);
      ws.onopen = () => { document.getElementById('conn').innerHTML = '&#9679; &#24050;&#36830;&#25509;'; document.getElementById('conn').style.color = '#3fb950'; };
      ws.onclose = () => { document.getElementById('conn').innerHTML = '&#9679; &#26029;&#24320;'; document.getElementById('conn').style.color = '#f85149'; setTimeout(connect, 2000); };
      ws.onmessage = e => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'snapshot') { Object.assign(S, msg.data); render(); }
        else if (msg.type === 'tick') handleTick(msg.data);
        else if (msg.type === 'character_detail') { charDetail = msg.data; renderDetail(); }
      };
    }

    // ── 加载角色卡 ──
    fetch('/api/cards').then(r => r.json()).then(d => { charCards = d; renderDetail(); }).catch(() => {});

    function handleTick(d) {
      S.tick = d.tick;
      S.formattedTime = d.formattedTime;
      if (d.characters) S.characters = d.characters;
      if (d.weather) S.weather = d.weather;
      if (d.nameMap) S.nameMap = d.nameMap;
      if (d.relationships) relationships = d.relationships;
      if (d.gameTime) S.gameTime = d.gameTime;

      // 更新 locations
      if (S.locations && d.characters) {
        for (const loc of S.locations) loc.presentCharacters = [];
        for (const ch of d.characters) {
          const loc = S.locations.find(l => l.id === ch.locationId);
          if (loc) loc.presentCharacters.push(ch.id);
        }
      }

      // 时间线追加
      tickLog.push({
        time: d.formattedTime,
        events: d.events || [],
        randomEvents: d.randomEvents || [],
        gossips: d.gossips || [],
        reflections: d.reflections || [],
      });
      if (tickLog.length > 300) tickLog = tickLog.slice(-300);

      render();
    }

    // ── Render ──
    function render() {
      document.getElementById('game-time').textContent = S.formattedTime || '-- : --';
      document.getElementById('weather').innerHTML = WEATHER[S.weather] || S.weather || '';
      renderSidebar();
      renderTimeline();
      renderDetail();
    }

    const EMOTION_LABEL = { happy:'开心', sad:'难过', angry:'生气', embarrassed:'尴尬', anxious:'焦虑', confident:'自信', lonely:'孤独', grateful:'感激' };
    const BOND_LABEL = { colleague:'同事', roommate:'室友', partner:'恋人', ex:'前任', mentor:'师徒', rival:'宿敌' };
    const SKILL_NAMES = { baking:'烘焙', social:'社交', barista:'咖啡', piano:'钢琴', etiquette:'礼仪', botany:'植物', guitar:'吉他', organizing:'整理', observation:'观察', writing:'写作' };

    function renderSidebar() {
      const el = document.getElementById('sidebar');
      el.innerHTML = S.characters.map(c => {
        const loc = S.locations?.find(l => l.id === c.locationId);
        const sel = c.id === selectedId ? 'selected' : '';
        const bars = ['hunger','energy','social','happiness','hygiene'].map(k => {
          const v = c.needs?.[k] ?? 0;
          return `<div class="mini-bar"><div class="fill" style="width:${v}%;background:${needColor(v)}"></div></div>`;
        }).join('');
        const action = c.currentAction ? `${c.currentAction.name}` : '';
        const occ = c.life?.occupation || '';
        const moodTags = (c.moodlets || []).slice(0, 2).map(m =>
          `<span class="moodlet-tag moodlet-${m.emotion}">${EMOTION_LABEL[m.emotion] || m.emotion}</span>`
        ).join('');
        return `<div class="char-card ${sel}" onclick="selectChar('${c.id}')">
          <div class="cc-name">${c.name}</div>
          <div class="cc-meta"><span class="cc-loc">${loc?.name || c.locationId}</span> &middot; &#128176;${c.gold ?? 0} ${action ? '&middot; ' + action : ''}</div>
          ${occ ? `<div class="cc-meta" style="color:#58a6ff">${occ}</div>` : ''}
          <div class="mini-bars">${bars}</div>
          ${moodTags ? `<div style="margin-top:3px">${moodTags}</div>` : ''}
        </div>`;
      }).join('');
    }

    function renderTimeline() {
      const el = document.getElementById('timeline');
      // 取最近 40 个 tick
      const recent = tickLog.slice(-40);
      if (recent.length === 0) { el.innerHTML = '<div class="no-data">&#31561;&#24453;&#20107;&#20214;...</div>'; return; }

      let html = '';
      for (const tick of recent) {
        const entries = [];

        // 随机事件
        for (const re of tick.randomEvents) {
          entries.push(`<div class="tick-entry is-random"><span class="te-action">&#9889; ${re.description}</span></div>`);
        }

        // 角色行为
        for (const evt of tick.events) {
          const name = N(evt.characterId);
          if (evt.skipped && evt.skipReason?.startsWith('执行中')) continue; // 跳过正在执行的

          if (evt.skipped) {
            // 跳过的 tick
            continue;
          }

          const isTalk = evt.action === 'talk';
          const isFail = evt.success === false;
          const cls = isFail ? 'is-fail' : isTalk ? 'is-talk' : '';

          let inner = `<span class="te-actor">${name}</span> `;
          if (isFail) {
            inner += `<span class="te-action" style="color:#f85149">&#10007; ${evt.description}</span>`;
          } else if (isTalk && evt.args) {
            const target = N(evt.args.target || '');
            const manner = evt.args.manner || '';
            const message = evt.args.message || '';
            inner += `<span class="te-action">&#8594; <span class="te-target">${target}</span></span>`;
            if (evt.thought) inner += `<div class="te-thought">${escHtml(evt.thought)}</div>`;
            inner += `<div class="te-dialogue">`;
            if (manner) inner += `<div class="te-manner">${escHtml(manner)}</div>`;
            inner += `<div class="te-message">${escHtml(message)}</div></div>`;
          } else {
            inner += `<span class="te-action">${evt.action || 'idle'} &mdash; ${evt.description || ''}</span>`;
            if (evt.thought) inner += `<div class="te-thought">${escHtml(evt.thought)}</div>`;
          }

          entries.push(`<div class="tick-entry ${cls}">${inner}</div>`);
        }

        // 反思
        for (const ref of tick.reflections) {
          if (!ref.insights?.length) continue;
          const name = N(ref.characterId);
          let reflectHtml = ref.insights.map(i => '- ' + escHtml(i)).join('\n');
          if (ref.wish) reflectHtml += `\n<span style="color:#3fb950">&#127775; 愿望: ${escHtml(ref.wish)}</span>`;
          if (ref.concern) reflectHtml += `\n<span style="color:#f85149">&#9888; 担忧: ${escHtml(ref.concern)}</span>`;
          entries.push(`<div class="tick-entry is-reflect">
            <span class="te-actor">${name}</span> <span class="te-action">&#128218; 反思 (${ref.mood})</span>
            <div class="te-thought">${reflectHtml}</div>
          </div>`);
        }

        if (entries.length > 0) {
          html += `<div class="tick-group"><div class="tick-header">${tick.time}</div>${entries.join('')}</div>`;
        }
      }

      el.innerHTML = html || '<div class="no-data">&#26242;&#26080;&#20107;&#20214;</div>';
      // 自动滚到底部
      el.scrollTop = el.scrollHeight;
    }

    // ── 右侧详情面板 ──
    function renderDetail() {
      const el = document.getElementById('detail');

      if (!selectedId) {
        // 全局概览
        let html = '<div class="global-overview">';
        // 关系网络
        if (relationships.length > 0) {
          html += `<div class="d-section"><div class="go-title">&#20851;&#31995;&#32593;&#32476;</div>`;
          for (const r of relationships) {
            const pct = Math.max(0, (r.level + 100) / 2);
            const bondTag = r.bond ? `<span class="bond-tag">${BOND_LABEL[r.bond] || r.bond}</span>` : '';
            html += `<div class="rel-row">
              <span class="r-name" onclick="selectChar('${r.a}')">${N(r.a)}</span>
              <span class="r-type">${r.type} (${r.level})${bondTag}</span>
              <span class="r-name" onclick="selectChar('${r.b}')">${N(r.b)}</span>
              <div class="r-bar"><div class="r-fill" style="width:${pct}%;background:${relColor(r.level)}"></div></div>
            </div>`;
          }
          html += '</div>';
        }
        // 地点概览
        if (S.locations?.length) {
          html += `<div class="d-section"><div class="go-title">&#22320;&#28857;</div>`;
          for (const loc of S.locations) {
            const chars = S.characters.filter(c => c.locationId === loc.id);
            const names = chars.map(c => `<span style="color:#58a6ff;cursor:pointer" onclick="selectChar('${c.id}')">${c.name}</span>`).join(', ');
            html += `<div style="padding:2px 0;font-size:12px">${loc.name}: ${names || '<span style="color:#30363d">&#26080;&#20154;</span>'}</div>`;
          }
          html += '</div>';
        }
        html += '</div>';
        el.innerHTML = html;
        return;
      }

      const ch = S.characters.find(c => c.id === selectedId);
      if (!ch) { el.innerHTML = '<div class="no-data">&#26410;&#25214;&#21040;</div>'; return; }

      // Tab bar
      const tabs = ['profile', 'memory', 'impressions'];
      const tabLabels = { profile: '&#26723;&#26696;', memory: '&#35760;&#24518;', impressions: '&#21360;&#35937;' };
      let tabHtml = '<div class="detail-tabs">';
      tabHtml += `<button onclick="selectChar(null)" style="flex:0;padding:8px 10px;color:#8b949e">&larr;</button>`;
      for (const t of tabs) {
        tabHtml += `<button class="${detailTab === t ? 'active' : ''}" onclick="setDetailTab('${t}')">${tabLabels[t]}</button>`;
      }
      tabHtml += '</div>';

      let body = '';
      if (detailTab === 'profile') body = renderProfileTab(ch);
      else if (detailTab === 'memory') body = renderMemoryTab(ch);
      else if (detailTab === 'impressions') body = renderImpressionsTab(ch);

      el.innerHTML = tabHtml + `<div class="detail-body">${body}</div>`;
    }

    function renderProfileTab(ch) {
      const loc = S.locations?.find(l => l.id === ch.locationId);
      const card = charCards?.[ch.id];
      const charRels = relationships.filter(r => r.a === ch.id || r.b === ch.id);
      const life = ch.life;

      let html = `<div class="profile-header">
        <div class="p-name">${ch.name}</div>
        <div class="p-meta">${life ? `${life.age} 岁 &middot; ${life.occupation}` : ''}</div>
        <div class="p-meta">${loc?.name || ch.locationId} &middot; &#128176;${ch.gold ?? 0}${ch.currentAction ? ' &middot; ' + ch.currentAction.name : ''}</div>
      </div>`;

      // 生活状态
      if (life) {
        html += '<div class="d-section"><div class="d-section-title">生活状态</div><div class="life-info">';
        const wpLoc = S.locations?.find(l => l.id === life.workplace);
        html += `<div><span class="li-label">工作地点: </span>${wpLoc?.name || life.workplace} &middot; 收入 ${life.income}/次</div>`;
        if (life.aspiration) html += `<div><span class="li-label">抱负: </span><span class="li-aspiration">${escHtml(life.aspiration)}</span></div>`;
        if (life.currentGoal) html += `<div><span class="li-label">目标: </span><span class="li-goal">${escHtml(life.currentGoal)}</span></div>`;
        if (life.currentConcern) html += `<div><span class="li-label">担忧: </span><span class="li-concern">${escHtml(life.currentConcern)}</span></div>`;
        html += '</div></div>';

        // 技能
        const skills = Object.entries(life.skills || {});
        if (skills.length > 0) {
          html += '<div class="d-section"><div class="d-section-title">技能</div>';
          for (const [sk, val] of skills) {
            const pct = Math.min(100, (val / 10) * 100);
            const name = SKILL_NAMES[sk] || sk;
            html += `<div class="skill-row"><span class="sk-name">${name}</span><div class="sk-bar"><div class="sk-fill" style="width:${pct}%"></div></div><span class="sk-val">${val.toFixed(1)}</span></div>`;
          }
          html += '</div>';
        }
      }

      // 情绪
      const moodlets = ch.moodlets || [];
      if (moodlets.length > 0) {
        html += '<div class="d-section"><div class="d-section-title">当前情绪</div>';
        for (const m of moodlets) {
          const stars = '&#9733;'.repeat(m.intensity);
          html += `<div style="margin:3px 0"><span class="moodlet-tag moodlet-${m.emotion}">${EMOTION_LABEL[m.emotion] || m.emotion} ${stars}</span> <span style="font-size:11px;color:#484f58">${escHtml(m.reason)}</span></div>`;
        }
        html += '</div>';
      }

      // 需求
      html += '<div class="d-section"><div class="d-section-title">需求</div>';
      for (const [k, label] of Object.entries(NEED_LABEL)) {
        const v = ch.needs?.[k] ?? 0;
        html += `<div class="need-row"><span class="n-label">${label}</span><div class="n-bar"><div class="n-fill" style="width:${v}%;background:${needColor(v)}"></div></div><span class="n-val">${Math.round(v)}</span></div>`;
      }
      html += '</div>';

      // 关系
      if (charRels.length > 0) {
        html += '<div class="d-section"><div class="d-section-title">关系</div>';
        for (const r of charRels) {
          const other = r.a === ch.id ? r.b : r.a;
          const pct = Math.max(0, (r.level + 100) / 2);
          const bondTag = r.bond ? `<span class="bond-tag">${BOND_LABEL[r.bond] || r.bond}</span>` : '';
          html += `<div class="rel-row" onclick="selectChar('${other}')"><span class="r-name">${N(other)}${bondTag}</span><span class="r-type">${r.type} (${r.level})</span><div class="r-bar"><div class="r-fill" style="width:${pct}%;background:${relColor(r.level)}"></div></div></div>`;
        }
        html += '</div>';
      }

      // 角色卡信息
      if (card) {
        if (card.appearance) html += `<div class="d-section"><div class="d-section-title">外貌</div><div class="profile-text">${escHtml(card.appearance)}</div></div>`;
        if (card.personality?.coreTraits) html += `<div class="d-section"><div class="d-section-title">性格</div><div class="profile-text">${escHtml(card.personality.coreTraits)}</div></div>`;
        if (card.personality?.psychology) html += `<div class="d-section"><div class="d-section-title">内心</div><div class="profile-text">${escHtml(card.personality.psychology)}</div></div>`;
        if (card.backstory?.length) {
          const bs = card.backstory.map(b => `- ${b.event} -> ${b.impact}`).join('\n');
          html += `<div class="d-section"><div class="d-section-title">过去</div><div class="profile-text">${escHtml(bs)}</div></div>`;
        }
      }

      return html;
    }

    function renderMemoryTab(ch) {
      if (!charDetail || charDetail.id !== ch.id) {
        // 请求详细数据
        if (ws?.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'get_character', data: { id: ch.id } }));
        }
        return '<div class="no-data">&#21152;&#36733;&#20013;...</div>';
      }

      const memories = charDetail.memories || [];
      if (memories.length === 0) return '<div class="no-data">&#26242;&#26080;&#35760;&#24518;</div>';

      let html = '';
      for (const m of memories.slice().reverse()) {
        const icon = MEM_ICON[m.type] || '&#9675;';
        html += `<div class="mem-item"><span class="m-type">${icon}</span> <span class="m-content">${escHtml(m.content)}</span><span class="m-imp">&#9734;${m.importance}</span></div>`;
      }
      return html;
    }

    function renderImpressionsTab(ch) {
      if (!charDetail || charDetail.id !== ch.id) {
        if (ws?.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'get_character', data: { id: ch.id } }));
        }
        return '<div class="no-data">&#21152;&#36733;&#20013;...</div>';
      }

      const imps = charDetail.impressions || [];
      if (imps.length === 0) return '<div class="no-data">&#26242;&#26080;&#21360;&#35937;</div>';

      let html = '';
      for (const imp of imps) {
        html += `<div class="imp-card">
          <span class="imp-target">${N(imp.characterId)}</span>
          ${imp.mentalLabel ? `<span class="imp-label">&#12300;${escHtml(imp.mentalLabel)}&#12301;</span>` : ''}
          <div class="imp-summary">${escHtml(imp.summary)}</div>
          ${imp.observations?.length ? `<div class="imp-obs">${imp.observations.map(o => '&#8226; ' + escHtml(o)).join('<br>')}</div>` : ''}
          ${imp.unresolved?.length ? `<div class="imp-q">${imp.unresolved.map(q => '? ' + escHtml(q)).join('<br>')}</div>` : ''}
        </div>`;
      }
      return html;
    }

    // ── Actions ──
    function selectChar(id) {
      selectedId = id;
      charDetail = null;
      detailTab = 'profile';
      if (id && ws?.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'get_character', data: { id } }));
      }
      render();
    }

    function setDetailTab(tab) { detailTab = tab; renderDetail(); }

    function setSpeed(speed) {
      document.querySelectorAll('.speed button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'set_speed', data: { speed } }));
    }

    function escHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    connect();
  </script>
</body>
</html>
